<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFather — Faith Education Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
/* ═══════════════════════════════════════════
   MYFATHER — Design System
   Aesthetic: Sacred luxury — dark vellum, 
   gold leaf, ancient manuscript meets modern
   ═══════════════════════════════════════════ */

:root {
  --ink:       #1a1410;
  --parchment: #f5f0e8;
  --vellum:    #ede7d5;
  --gold:      #c9973a;
  --gold-lt:   #e8c97a;
  --gold-dk:   #8a6420;
  --crimson:   #8b1a1a;
  --azure:     #1a4a8b;
  --sage:      #3d6b4f;
  --pearl:     #faf8f3;
  --shadow:    rgba(26,20,16,0.18);

  /* Kids palette */
  --kids-sky:    #6bbde3;
  --kids-sun:    #ffd166;
  --kids-grass:  #78c87a;
  --kids-cloud:  #f0f4ff;
  --kids-warm:   #ff8c69;

  --font-display: 'Cinzel', serif;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', sans-serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;

  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--parchment);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dk); border-radius: 3px; }

/* ══════════════════════════════════
   LAYOUT
══════════════════════════════════ */
#app { min-height: 100vh; }

.page { display: none; min-height: 100vh; }
.page.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════
   COMPONENTS — Buttons
══════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 12px 28px; border-radius: 40px;
  border: none; cursor: pointer;
  transition: var(--transition); text-decoration: none;
  letter-spacing: 0.03em;
}
.btn-gold {
  background: var(--gold);
  color: var(--ink);
}
.btn-gold:hover { background: var(--gold-lt); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,151,58,0.35); }

.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}
.btn-outline:hover { background: rgba(201,151,58,0.1); }

.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,0.12);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }

.btn-danger {
  background: var(--crimson); color: white;
}
.btn-sm { padding: 8px 18px; font-size: 13px; }
.btn-lg { padding: 16px 40px; font-size: 16px; }

/* ══════════════════════════════════
   COMPONENTS — Cards
══════════════════════════════════ */
.card {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(201,151,58,0.45);
  background: rgba(245,240,232,0.08);
}
.card-gold {
  background: linear-gradient(135deg, rgba(201,151,58,0.15), rgba(138,100,32,0.08));
  border-color: rgba(201,151,58,0.4);
}

/* ══════════════════════════════════
   COMPONENTS — Badge
══════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase;
}
.badge-gold { background: rgba(201,151,58,0.2); color: var(--gold-lt); border: 1px solid rgba(201,151,58,0.3); }
.badge-green { background: rgba(61,107,79,0.3); color: #7ecfa0; border: 1px solid rgba(61,107,79,0.4); }
.badge-red { background: rgba(139,26,26,0.3); color: #f08080; border: 1px solid rgba(139,26,26,0.4); }
.badge-blue { background: rgba(26,74,139,0.3); color: #7ab0f0; border: 1px solid rgba(26,74,139,0.4); }
.badge-kids { background: rgba(107,189,227,0.2); color: var(--kids-sky); border: 1px solid rgba(107,189,227,0.35); }

/* ══════════════════════════════════
   COMPONENTS — Inputs
══════════════════════════════════ */
.input-wrap { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 12px; color: rgba(245,240,232,0.5); letter-spacing: 0.04em; text-transform: uppercase; }

.input, .textarea, .select {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-sm);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 15px;
  padding: 12px 16px;
  transition: var(--transition);
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,240,232,0.09);
  box-shadow: 0 0 0 3px rgba(201,151,58,0.12);
}
.textarea { resize: vertical; min-height: 100px; }
.select { appearance: none; cursor: pointer; }

/* ══════════════════════════════════
   COMPONENTS — Navigation
══════════════════════════════════ */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid rgba(201,151,58,0.15);
  position: sticky; top: 0; z-index: 100;
  background: rgba(26,20,16,0.92);
  backdrop-filter: blur(20px);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px; color: var(--gold);
  letter-spacing: 0.1em; cursor: pointer;
  text-decoration: none;
}
.nav-logo span { color: var(--parchment); opacity: 0.5; font-size: 12px; display: block; letter-spacing: 0.2em; font-family: var(--font-body); font-weight: 300; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link {
  font-size: 13px; color: rgba(245,240,232,0.6);
  padding: 8px 14px; border-radius: 20px;
  cursor: pointer; transition: var(--transition);
  text-decoration: none; border: none; background: none; font-family: var(--font-body);
}
.nav-link:hover { color: var(--gold); background: rgba(201,151,58,0.08); }
.nav-link.active { color: var(--gold); }

/* ══════════════════════════════════
   LANDING PAGE
══════════════════════════════════ */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 80px 40px;
  position: relative; overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(201,151,58,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139,26,26,0.08) 0%, transparent 60%);
}

.hero-cross {
  width: 48px; height: 48px;
  margin: 0 auto 32px;
  opacity: 0.7;
}

.hero-eyebrow {
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1.05; color: var(--parchment);
  margin-bottom: 12px;
}
.hero-title em { color: var(--gold); font-style: italic; font-family: var(--font-serif); }

.hero-sub {
  font-family: var(--font-serif);
  font-size: clamp(18px, 2.5vw, 24px);
  color: rgba(245,240,232,0.55);
  font-style: italic; margin-bottom: 48px;
  max-width: 520px;
}

.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.hero-modes {
  display: flex; gap: 20px; margin-top: 64px;
  justify-content: center; flex-wrap: wrap;
}
.mode-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl);
  padding: 32px 28px; width: 240px; cursor: pointer;
  transition: var(--transition); text-align: center;
}
.mode-card:hover {
  transform: translateY(-4px);
  border-color: rgba(201,151,58,0.5);
  background: rgba(201,151,58,0.08);
  box-shadow: 0 20px 40px rgba(201,151,58,0.12);
}
.mode-card.kids { border-color: rgba(107,189,227,0.3); }
.mode-card.kids:hover { border-color: var(--kids-sky); background: rgba(107,189,227,0.08); }
.mode-emoji { font-size: 40px; margin-bottom: 14px; }
.mode-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.mode-card.kids .mode-title { color: var(--kids-sky); }
.mode-desc { font-size: 13px; color: rgba(245,240,232,0.5); line-height: 1.6; }

/* ══════════════════════════════════
   DASHBOARD
══════════════════════════════════ */
.dashboard { flex: 1; display: flex; }
.sidebar {
  width: 260px; min-height: calc(100vh - 73px);
  border-right: 1px solid rgba(201,151,58,0.12);
  padding: 28px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-section {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); padding: 16px 12px 6px; font-weight: 500;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition);
  font-size: 14px; color: rgba(245,240,232,0.6);
  border: none; background: none; font-family: var(--font-body);
  width: 100%; text-align: left;
}
.sidebar-item svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
.sidebar-item:hover { background: rgba(201,151,58,0.08); color: var(--gold); }
.sidebar-item:hover svg { opacity: 1; }
.sidebar-item.active { background: rgba(201,151,58,0.12); color: var(--gold); font-weight: 500; }
.sidebar-item.active svg { opacity: 1; }
.sidebar-badge { margin-left: auto; font-size: 10px; background: var(--crimson); color: white; padding: 2px 6px; border-radius: 10px; }

.main-content { flex: 1; padding: 36px 40px; overflow-y: auto; }
.page-header { margin-bottom: 32px; }
.page-header h1 { font-family: var(--font-serif); font-size: 32px; font-weight: 300; color: var(--parchment); margin-bottom: 4px; }
.page-header p { font-size: 14px; color: rgba(245,240,232,0.45); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: rgba(245,240,232,0.04); border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-md); padding: 20px;
}
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,240,232,0.4); margin-bottom: 8px; }
.stat-value { font-family: var(--font-serif); font-size: 36px; color: var(--gold); line-height: 1; }
.stat-sub { font-size: 12px; color: rgba(245,240,232,0.4); margin-top: 4px; }

/* ══════════════════════════════════
   AI CHAT
══════════════════════════════════ */
.chat-container {
  display: flex; flex-direction: column;
  height: calc(100vh - 160px); max-width: 760px; margin: 0 auto;
}
.chat-mode-bar {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.mode-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(245,240,232,0.15);
  background: transparent; cursor: pointer;
  font-size: 13px; color: rgba(245,240,232,0.5);
  font-family: var(--font-body); transition: var(--transition);
}
.mode-pill.active {
  border-color: var(--gold); color: var(--gold);
  background: rgba(201,151,58,0.1);
}
.mode-pill.kids-mode.active {
  border-color: var(--kids-sky); color: var(--kids-sky);
  background: rgba(107,189,227,0.1);
}

.chat-messages {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 4px 2px; padding-bottom: 20px;
}
.message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
.message.user { flex-direction: row-reverse; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  border: 1px solid rgba(201,151,58,0.3);
  background: rgba(201,151,58,0.1);
}
.msg-bubble {
  max-width: 75%; padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 15px; line-height: 1.65;
}
.message.ai .msg-bubble {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.1);
  color: var(--parchment);
  border-top-left-radius: 4px;
}
.message.user .msg-bubble {
  background: rgba(201,151,58,0.18);
  border: 1px solid rgba(201,151,58,0.25);
  color: var(--parchment);
  border-top-right-radius: 4px;
}
.msg-verse {
  margin-top: 10px; padding: 10px 14px;
  background: rgba(201,151,58,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: var(--font-serif); font-style: italic;
  font-size: 14px; color: rgba(245,240,232,0.7);
}
.msg-ref { font-size: 11px; color: var(--gold); opacity: 0.7; margin-top: 4px; font-style: normal; font-family: var(--font-body); }

/* Crisis / Safety alert in chat */
.msg-crisis {
  background: rgba(139,26,26,0.15);
  border: 1px solid rgba(139,26,26,0.4);
  border-radius: var(--radius-md); padding: 14px 16px; margin-top: 10px;
}
.msg-crisis-title { font-size: 13px; font-weight: 500; color: #f08080; margin-bottom: 8px; }
.msg-crisis-line { font-size: 13px; color: rgba(245,240,232,0.7); margin-bottom: 4px; }

.chat-input-area {
  padding: 16px 0 0;
  border-top: 1px solid rgba(245,240,232,0.08);
}
.chat-input-row {
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input-wrap { flex: 1; position: relative; }
.chat-input {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-xl);
  color: var(--parchment); font-family: var(--font-body); font-size: 15px;
  padding: 14px 48px 14px 20px;
  width: 100%; resize: none; max-height: 140px;
  transition: var(--transition);
}
.chat-input:focus { outline: none; border-color: var(--gold); background: rgba(245,240,232,0.09); }
.chat-send {
  position: absolute; right: 10px; bottom: 10px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); color: var(--ink);
}
.chat-send:hover { background: var(--gold-lt); transform: scale(1.05); }
.chat-disclaimer { font-size: 11px; color: rgba(245,240,232,0.25); text-align: center; margin-top: 8px; }

/* ══════════════════════════════════
   LESSONS
══════════════════════════════════ */
.lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.lesson-card {
  border-radius: var(--radius-lg); overflow: hidden;
  cursor: pointer; transition: var(--transition);
  border: 1px solid rgba(201,151,58,0.15);
  background: rgba(245,240,232,0.03);
}
.lesson-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,0.4); border-color: rgba(201,151,58,0.4); }
.lesson-thumb {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; position: relative; overflow: hidden;
}
.lesson-thumb::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(201,151,58,0.2), rgba(26,20,16,0.4));
}
.lesson-body { padding: 18px; }
.lesson-title { font-family: var(--font-serif); font-size: 18px; margin-bottom: 6px; }
.lesson-meta { font-size: 12px; color: rgba(245,240,232,0.4); display: flex; gap: 12px; }
.lesson-progress { height: 3px; background: rgba(245,240,232,0.1); border-radius: 2px; margin-top: 14px; }
.lesson-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }

/* Kids lesson cards */
.lesson-card.kids-card { border-color: rgba(107,189,227,0.2); }
.lesson-card.kids-card:hover { border-color: var(--kids-sky); box-shadow: 0 16px 36px rgba(107,189,227,0.12); }

/* ══════════════════════════════════
   DEVOTIONAL
══════════════════════════════════ */
.devotional-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl); padding: 48px;
  text-align: center;
}
.devotional-date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px; }
.devotional-verse {
  font-family: var(--font-serif); font-size: 26px;
  font-style: italic; line-height: 1.5;
  color: var(--parchment); margin-bottom: 12px;
}
.devotional-ref { font-size: 13px; color: var(--gold); margin-bottom: 32px; }
.devotional-body {
  font-size: 16px; line-height: 1.8;
  color: rgba(245,240,232,0.7); text-align: left;
}
.devotional-reflection {
  margin-top: 28px; padding: 20px 24px;
  background: rgba(201,151,58,0.07);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--gold);
  font-size: 15px; color: rgba(245,240,232,0.65); line-height: 1.7;
  text-align: left;
}
.devotional-actions { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }

/* ══════════════════════════════════
   READING PLAN
══════════════════════════════════ */
.reading-plan { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
.plan-calendar { }
.plan-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.plan-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: var(--transition); border: 1px solid rgba(245,240,232,0.08);
  flex-direction: column; gap: 2px;
}
.plan-day.done { background: rgba(61,107,79,0.3); border-color: rgba(61,107,79,0.5); color: #7ecfa0; }
.plan-day.today { background: rgba(201,151,58,0.2); border-color: var(--gold); color: var(--gold); }
.plan-day.upcoming { color: rgba(245,240,232,0.3); }
.plan-day .day-num { font-size: 14px; }
.plan-day .day-check { font-size: 10px; }

.reading-content { }
.book-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.book-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid rgba(245,240,232,0.15); background: transparent;
  color: rgba(245,240,232,0.5); cursor: pointer; transition: var(--transition);
  font-family: var(--font-body);
}
.book-btn:hover, .book-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,151,58,0.1); }

.passage-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-lg); padding: 32px;
}
.passage-text {
  font-family: var(--font-serif); font-size: 17px; line-height: 1.9;
  color: rgba(245,240,232,0.82);
}
.verse-num { font-size: 11px; color: var(--gold); vertical-align: super; margin-right: 3px; font-family: var(--font-body); }

/* ══════════════════════════════════
   QUIZ / GAMES
══════════════════════════════════ */
.quiz-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl); padding: 40px;
}
.quiz-progress-bar { height: 4px; background: rgba(245,240,232,0.1); border-radius: 2px; margin-bottom: 32px; }
.quiz-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
.quiz-q { font-family: var(--font-serif); font-size: 22px; line-height: 1.5; margin-bottom: 28px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  display: flex; align-items: center; gap: 14px;

  const { data } = await db.from('profiles').select('*').eq('id',uid).single();

  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  try {
    const { count } = await db.from('chat_sessions')
      .select('*',{count:'exact',head:true})
      .eq('user_id',uid).gte('created_at',start.toISOString());
    state.msgThisMonth = count||0;
  } catch{ state.msgThisMonth=0; }

async function loadContentFromDB(){
  try {
    const day = Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);

    const [vRes,qRes,dRes,rRes] = await Promise.all([
      db.from('daily_verses').select('*').eq('day_of_year',day).single(),

    if(rRes.data) state.contentCache.reading = rRes.data;

}

    }
  }
  loadContentFromDB(); // paralelo, no bloquea
  buildApp();
}

function navigate(page){
  if(page==='app' && !state.user){ navigate('login'); return; }
  state.page=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  window.scrollTo(0,0);
}

function navigateApp(pg){
  if(!state.user){ navigate('login'); return; }
  _currentPage = pg;
  const map = {
    home:buildHome, chat:buildChat, lessons:buildLessons,
    devotional:buildDevotional, reading:buildReading,
    quiz:buildQuiz, haven:buildHaven, churches:buildChurches, store:buildStore
  };
  const mc = document.getElementById('main-content');
  if(!mc) return;
  mc.innerHTML = (map[pg]||buildHome)();
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.toggle('active',i.dataset.page===pg));

  if(state.user?.plan==='free' && daysSinceJoined()>=14 && pg==='home'){

let chatBusy=false;
const SUICIDE_KW=['suicid','matarme','quitarme la vida','no quiero vivir','kill myself','end my life','dont want to live','hurt myself','hacerme daño','quiero morir'];
const ABUSE_KW=['me golpea','me pega','me toca','me hace daño','me abusa','abuse','hitting me','touching me','hurts me','me viola','rape','violated','molest','robé','robamos','ilegal','illegal'];
function detectCrisis(txt){
  const l=txt.toLowerCase();
  if(SUICIDE_KW.some(k=>l.includes(k))) return 'suicide';
  if(ABUSE_KW.some(k=>l.includes(k)))   return 'abuse';
  return null;
}

    {p:/orar|oración|rezar|cómo (se )?ora|no sé orar/i, r:()=>`Orar es simplemente hablar con Dios como hablarías con alguien que te ama profundamente. Sin fórmulas perfectas.\n\nJesús enseñó el Padre Nuestro como modelo (Mateo 6:9-13):\n• Adoración: "Padre nuestro... santificado sea tu nombre"\n• Petición: "Danos el pan de hoy"\n• Perdón: "Perdona nuestras deudas"\n• Protección: "Líbranos del mal"\n\nPuedes empezar ahora mismo con: *"Dios, no sé bien cómo orar, pero aquí estoy..."*`},
    {p:/biblia.*empez|por dónde empez|cómo leer la biblia|primer.*(libro|cosa)/i, r:()=>`Si quieres conocer a Jesús: empieza por el **Evangelio de Juan** — es el más personal y profundo de los 4 evangelios.\n\nSi quieres las grandes historias: **Génesis, Éxodo, Samuel, Daniel**.\n\nPara sabiduría diaria: **Proverbios** (31 capítulos, uno por día del mes).\n\nPara oración honesta con Dios: **Salmos**.\n\n¿Qué buscas en este momento de tu vida?`},
    {p:/génesis|creación|adán|eva|jardín.*edén|principio.*mundo/i, r:()=>`Génesis es el primer libro y significa *"origen"* o *"principio"*. *"En el principio creó Dios los cielos y la tierra."* — Génesis 1:1\n\nNo es solo una historia de cómo se hizo el mundo — es una declaración de **quién** lo hizo y **por qué**: un Dios personal que considera su creación "muy buena", incluyéndote a ti.\n\n¿Qué parte de Génesis te genera curiosidad o dudas?`},
    {p:/jesús|jesucristo|cristo|quién es jesús|vida de jesús/i, r:()=>`Jesús es la figura central del cristianismo. Él mismo dijo: *"Yo soy el camino, la verdad y la vida."* — Juan 14:6\n\nNo fue solo un maestro moral o profeta — los primeros seguidores lo reconocieron como Dios hecho hombre (Juan 1:14). Vivió en Israel en el siglo I, enseñó, sanó, fue crucificado y resucitó.\n\n¿Qué aspecto de su vida o enseñanza quieres explorar?`},
    {p:/salmo|salmos\b|david.*escribió|libro.*poesía/i, r:()=>`Los Salmos son el libro de oración de la Biblia — 150 poemas que cubren todo el espectro humano: alabanza, dolor, enojo, duda, gratitud, desesperación, esperanza.\n\nEl más famoso: *"Jehová es mi pastor; nada me faltará."* — Salmo 23\n\nEl más honesto sobre el dolor: Salmo 22, que empieza con el grito de Jesús en la cruz.\n\n¿Buscas algún Salmo en particular o quieres que te recomiende uno según lo que sientes hoy?`},
    {p:/proverbios|sabiduría.*práctica|sabiduría bíblica/i, r:()=>`Proverbios es el libro de sabiduría práctica de la Biblia. *"El principio de la sabiduría es el temor de Jehová."* — Proverbios 1:7\n\nTiene 31 capítulos — uno por cada día del mes. Abarca finanzas, relaciones, trabajo, familia, lenguaje, amistad. Es increíblemente aplicable hoy.\n\n¿Sobre qué área de tu vida quieres sabiduría?`},
    {p:/pablo|cartas de pablo|epístolas|romanos|corintios|gálatas|efesios|filipenses/i, r:()=>`Pablo escribió 13 de los 27 libros del Nuevo Testamento. Fue primero perseguidor de cristianos hasta que tuvo un encuentro radical con Jesús en el camino a Damasco (Hechos 9).\n\nSus cartas más influyentes:\n• **Romanos** — teología de la salvación\n• **1 Corintios 13** — el famoso capítulo sobre el amor\n• **Gálatas** — libertad en Cristo vs legalismo\n• **Filipenses** — gozo en medio del sufrimiento\n\n¿Cuál quieres explorar?`},
    {p:/perdón|perdonar|culpa|me siento culpable|cometí un.*pecado|pecado/i, r:()=>`El perdón es el corazón del evangelio cristiano. *"Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados y limpiarnos de toda maldad."* — 1 Juan 1:9\n\nNo hay nada tan grave que esté más allá de la gracia de Dios. Pedro negó a Jesús 3 veces y fue restaurado completamente. Pablo perseguía y mataba cristianos antes de ser apóstol.\n\n¿Hay algo específico que te pesa?`},
    {p:/muerte|morir|qué pasa cuando morimos|vida.*después|cielo|infierno/i, r:()=>`La Biblia habla de esperanza más allá de la muerte. Jesús dijo: *"Yo soy la resurrección y la vida; el que cree en mí, aunque esté muerto, vivirá."* — Juan 11:25\n\nPablo escribe que "estar ausente del cuerpo es estar con el Señor" (2 Corintios 5:8).\n\nNo es solo sobre el cielo — es sobre una relación con Dios que comienza ahora y continúa para siempre. ¿Estás atravesando una pérdida o es una pregunta más general?`},
    {p:/trinidad|padre.*hijo.*espíritu|espíritu (santo|de dios)/i, r:()=>`La Trinidad es el misterio más profundo del cristianismo: un solo Dios en tres personas — Padre, Hijo y Espíritu Santo. No se explica fácilmente con lógica humana.\n\nUna analogía imperfecta: el agua puede ser líquido, hielo y vapor — misma sustancia, formas distintas.\n\nLa Trinidad aparece en el bautismo de Jesús (Mateo 3): el Hijo en el agua, el Espíritu como paloma, el Padre hablando desde el cielo.\n\n¿Qué parte te genera más preguntas?`},
    {p:/fe\b|qué es la fe|cómo tener fe|tengo poca fe/i, r:()=>`*"La fe es la certeza de lo que se espera, la convicción de lo que no se ve."* — Hebreos 11:1\n\nLa fe bíblica no es creer sin evidencia — es confiar en una persona (Dios) basándote en lo que ya conoces de Él. Es como confiar en un puente: no analizas cada tornillo, simplemente caminas porque el puente ha demostrado ser sólido.\n\nLa fe crece con la experiencia. ¿En qué área sientes que tu fe necesita crecer?`},
    {p:/noé|arca|diluvio|génesis.*6|génesis.*7/i, r:()=>`Noé es uno de los grandes ejemplos de fe obediente. Construyó un arca sin haber visto lluvia torrencial — solo porque confió en la palabra de Dios.\n\n*"Noé halló gracia ante los ojos de Jehová."* — Génesis 6:8\n\nEl arcoíris al final no es solo un fenómeno natural — es la primera promesa (alianza) de Dios registrada en la Biblia. La señal de que Dios mantiene sus compromisos.`},
    {p:/apocalipsis|fin del mundo|revelación|últimos tiempos|tribulación/i, r:()=>`El Apocalipsis es el libro más malinterpretado de la Biblia. Fue escrito en lenguaje simbólico (apocalíptico) para cristianos bajo persecución romana — no era un manual de predicción del futuro.\n\nSu mensaje central es de **esperanza**: Dios tiene la última palabra sobre la historia.\n\n*"He aquí yo hago nuevas todas las cosas."* — Apocalipsis 21:5\n\n¿Qué parte específica del Apocalipsis te genera curiosidad o preocupación?`},
    {p:/10 mandamientos|diez mandamientos|éxodo.*20|mandamiento/i, r:()=>`Los Diez Mandamientos (Éxodo 20) son el fundamento de la ley mosaica. Jesús los resumió en dos principios (Mateo 22:37-39):\n\n1. Amar a Dios con todo tu corazón, alma y mente\n2. Amar al prójimo como a ti mismo\n\nPablo añade: "El amor es el cumplimiento de la ley" (Romanos 13:10). No son reglas para ganarte el amor de Dios — son el fruto natural de quien ya lo tiene. ¿Cuál mandamiento te genera más reflexión?`},
    {p:/iglesia|congregación|dónde.*iglesia|cómo.*iglesia/i, r:()=>`La comunidad cristiana es importante en la fe. *"No dejando de congregarnos, como algunos tienen por costumbre."* — Hebreos 10:25\n\nEn la sección de Iglesias de la app puedes encontrar congregaciones cercanas a tu ubicación y registrar tu propia iglesia si eres líder.\n\nSi buscas una iglesia, te recomiendo buscar una donde:\n• La Biblia sea el centro de la enseñanza\n• Sientas que puedes hacer preguntas\n• Haya comunidad real fuera del domingo`},

    {p:/sad|depressed|feeling (low|down|bad)|lonely|crying|hurting/i, r:()=>`I'm sorry you're going through this. God sees your pain. *"The Lord is close to the brokenhearted and saves those who are crushed in spirit."* — Psalm 34:18\n\nYou don't have to carry this alone. Would you like to tell me what's going on?`},
    {p:/anxious|anxiety|worried|worry|stress|overwhelmed/i, r:()=>`Anxiety is real and exhausting. God knows. *"Do not be anxious about anything, but in every situation, by prayer and petition, present your requests to God. And the peace of God, which transcends all understanding, will guard your hearts."* — Philippians 4:6-7\n\nWhat's worrying you?`},
    {p:/jesus|christ|who is jesus|life of jesus/i, r:()=>`Jesus is the center of Christian faith. He said: *"I am the way and the truth and the life. No one comes to the Father except through me."* — John 14:6\n\nHe was more than a moral teacher — his first followers recognized him as God made flesh (John 1:14). What would you like to know about him?`},

    {p:/faith|what is faith|how (to have|do I get) faith/i, r:()=>`*"Now faith is confidence in what we hope for and assurance about what we do not see."* — Hebrews 11:1\n\nFaith isn't belief without evidence — it's trusting a person (God) based on what you already know about him. Like trusting a bridge: you don't analyze every bolt, you walk because it has proven solid.\n\nFaith grows through experience. In what area do you feel your faith needs to grow?`},

function getCapa1(txt){
  const pool = PREP[state.lang==='en'?'en':'es']||PREP.es;
  const lower = txt.toLowerCase();
  for(const e of pool){ if(e.p.test(lower)) return e.r(state.user?.name||''); }
  return null;
}

// Keywords que activan DeepSeek (preguntas teológicas profundas)
const DEEP_KW = ['teodicea','predestinación','predestination','libre albedrío','free will','sufrimiento y dios','why does god allow','encarnación','escatología','expiación','atonement','hermenéutica','apologética','diferencia entre','compare','contradice','contradicción','qué dice la biblia sobre','what does the bible say about','explain','explica','profundamente','análisis','analiza'];

function needsDeep(txt){ return txt.length > 90 || DEEP_KW.some(k=>txt.toLowerCase().includes(k)); }

function renderMsg(reply, lid){
  const msgs = document.getElementById('chat-msgs');
  document.getElementById(lid)?.remove();
  const vm = reply.match(/["""]([^"""]{10,})["""]\s*[—–-]\s*(\S[^\n]{0,60})/);
  let main=esc(reply), vhtml='';
  if(vm){ vhtml=`<div class="msg-verse">${esc(vm[1])}<div class="msg-ref">— ${esc(vm[2])}</div></div>`; main=esc(reply.replace(vm[0],'')).trim(); }
  msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${main}${vhtml}</div></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat(){
  if(chatBusy) return;
  const inp = document.getElementById('chat-inp');
  const txt = inp.value.trim(); if(!txt) return;
  inp.value='';
  const msgs = document.getElementById('chat-msgs');
  if(!msgs) return;

  msgs.innerHTML += `<div class="message user"><div class="msg-avatar">👤</div><div><div class="msg-bubble">${esc(txt)}</div></div></div>`;

  // Crisis siempre primero
  const cr = detectCrisis(txt);
  if(cr==='suicide'){ msgs.innerHTML+=crisisMsg(); msgs.scrollTop=msgs.scrollHeight; return; }
  if(cr==='abuse')  { msgs.innerHTML+=abuseMsg();  msgs.scrollTop=msgs.scrollHeight; return; }

  // ── Capa 1: Respuesta preprogramada ──
  const capa1 = getCapa1(txt);
  if(capa1 && !needsDeep(txt)){
    const fake = 'l'+Date.now();
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:capa1});
    msgs.innerHTML += `<div class="message ai" id="${fake}"></div>`;
    renderMsg(capa1, fake);
    // Guardar en DB (no bloquear)
    if(state.user) db.from('chat_sessions').insert({user_id:state.user.id,mode:state.mode,lang:state.lang,messages:[{role:'user',content:txt},{role:'assistant',content:capa1}],created_at:new Date().toISOString()}).catch(()=>{});
    return;
  }

  // ── Capa 2/3: Verificar límite ──
  if(!canChat()){
    const isEs = state.lang==='es';
    msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">
      ${isEs?`Has usado todos tus mensajes IA de este mes (${msgLimit()}). Puedes comprar más o actualizar tu plan.`:`You've used all your AI messages this month (${msgLimit()}). Buy more or upgrade your plan.`}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-sm" onclick="navigate('pricing-page')">${isEs?'Ver planes →':'See plans →'}</button>
        <button class="btn btn-outline btn-sm" onclick="navigateApp('store')">${isEs?'Comprar mensajes':'Buy messages'}</button>
      </div>
    </div></div></div>`;
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }

  // ── Capa 2/3: DeepSeek vía Worker ──
  const lid = 'l'+Date.now();
  msgs.innerHTML += `<div class="message ai" id="${lid}"><div class="msg-avatar">✝️</div><div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  chatBusy = true;

  const lng = state.lang==='en'?'English':'Spanish (español)';
  const deep = needsDeep(txt);
  const sys = state.mode==='kids'
    ? `You are a warm biblical guide for children ages 4-12. Always respond in ${lng}. Use simple language and emojis ⭐🙏. NEVER inappropriate content. If danger, say to talk to a trusted adult. Max 3 short paragraphs.`
    : `You are a wise Christian biblical tutor for MyFather app. Always respond in ${lng}. Cite Bible verses with exact references. Be compassionate and deep. If suicidal thoughts, respond with love and include crisis resources immediately. Max ${deep?280:120} words.`;

  try{
    const r = await fetch(`${CF}/ai/chat`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({layer:deep?3:2,system:sys,messages:[...state.chatHistory.slice(-6),{role:'user',content:txt}],max_tokens:deep?500:180})
    });
    if(!r.ok) throw new Error(`Worker ${r.status}`);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    const reply = d.content?.[0]?.text || (state.lang==='en'?'Could not get a response.':'No se pudo obtener respuesta.');
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:reply});
    state.msgThisMonth++;
    renderMsg(reply, lid);
    // Guardar en DB
    if(state.user) db.from('chat_sessions').insert({user_id:state.user.id,mode:state.mode,lang:state.lang,messages:[{role:'user',content:txt},{role:'assistant',content:reply}],created_at:new Date().toISOString()}).catch(()=>{});
  }catch(e){
    document.getElementById(lid)?.remove();
    const isEs = state.lang==='es';
    msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble" style="color:rgba(245,240,232,0.5)">${isEs?'Hubo un problema de conexión. Intenta de nuevo.':'Connection issue. Please try again.'}</div></div></div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }
  chatBusy=false;
  msgs.scrollTop = msgs.scrollHeight;
}

function buildQuiz(){state.quizState={q:0,score:0,answered:false};return renderQuizQ();}
function renderQuizQ(){
  const qs=QUIZ[state.lang]||QUIZ.es;
  if(state.quizState.q>=qs.length) return renderQuizEnd();
  const q=qs[state.quizState.q];
  return `<div class="page-header"><h1>${t('quizTitle')}</h1><p>${t('quizSub')}</p></div>
<div class="quiz-streak">${ic('star')} ${t('quizStreakLabel')} ${state.streak} · ${t('quizScoreLabel')} ${state.quizState.score}/${state.quizState.q}</div>
<div class="quiz-card">
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(state.quizState.q/qs.length)*100}%"></div></div>
  <div style="font-size:12px;color:rgba(245,240,232,0.35);margin-bottom:20px">${t('quizQuestion')} ${state.quizState.q+1} ${t('quizOf')} ${qs.length}</div>
  <div class="quiz-q">${q.q}</div>
  <div class="quiz-options" id="qopts">
    ${q.opts.map((o,i)=>`<div class="quiz-option" id="qo${i}" onclick="answerQuiz(${i})"><div class="quiz-letter">${'ABCD'[i]}</div><span>${o}</span></div>`).join('')}
  </div>
  <div id="qfb" style="margin-top:20px;display:none"></div>
</div>`;
}
function answerQuiz(idx){
  if(state.quizState.answered) return;
  state.quizState.answered=true;
  const qs=QUIZ[state.lang]||QUIZ.es;
  const q=qs[state.quizState.q];
  document.getElementById(`qo${q.correct}`)?.classList.add('correct');
  if(idx!==q.correct) document.getElementById(`qo${idx}`)?.classList.add('wrong');
  else state.quizState.score++;
  const fb=document.getElementById('qfb'); if(!fb) return;
  fb.style.display='block';
  fb.innerHTML=`<div style="font-size:14px;color:rgba(245,240,232,0.6);margin-bottom:12px">${idx===q.correct?t('quizCorrect'):`${t('quizWrong')} <strong style="color:#7ecfa0">${q.opts[q.correct]}</strong>`}</div>
  <div style="font-family:var(--font-serif);font-style:italic;font-size:14px;color:rgba(245,240,232,0.5);margin-bottom:14px">${t('quizRef')} ${q.verse}</div>
  <button class="btn btn-gold btn-sm" onclick="nextQuizQ()">${state.quizState.q+1<qs.length?t('quizNext'):t('quizFinish')}</button>`;
}
function nextQuizQ(){state.quizState.q++;state.quizState.answered=false;document.getElementById('main-content').innerHTML=renderQuizQ();}
function renderQuizEnd(){
  const total=(QUIZ[state.lang]||QUIZ.es).length;
  const pct=Math.round((state.quizState.score/total)*100);
  return `<div class="page-header"><h1>${t('quizCompleteTitle')}</h1></div>

  <div style="font-size:64px;margin-bottom:20px">${pct>=80?'🏆':pct>=60?'⭐':'📖'}</div>

function loadChurchesByGPS(){
  const locEl = document.getElementById('ch-loc');
  const listEl = document.getElementById('ch-list');
  if(!locEl||!listEl) return;

  if(!navigator.geolocation){
    if(locEl) locEl.textContent = state.lang==='es'?'GPS no disponible':'GPS not available';
    renderChurchFallback(listEl);
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng} = pos.coords;
    if(locEl) locEl.innerHTML = `<strong style="color:var(--parchment)">${lat.toFixed(4)}, ${lng.toFixed(4)}</strong> — <a href="https://www.google.com/maps/search/iglesias+cristianas/@${lat},${lng},13z" target="_blank" rel="noopener" style="color:var(--gold)">${state.lang==='es'?'Ver en Google Maps':'View on Google Maps'}</a>`;
    // Intentar cargar desde Supabase (iglesias aprobadas)
    db.from('church_registrations').select('*').eq('status','approved')
      .limit(20)
      .then(({data})=>{
        if(data?.length) renderChurchList(listEl, data);
        else renderChurchFallback(listEl);
      }).catch(()=>renderChurchFallback(listEl));
  }, ()=>{
    if(locEl) locEl.textContent = state.lang==='es'?'Sin permiso de ubicación':'Location permission denied';
    renderChurchFallback(listEl);
  },{timeout:6000});
}

function renderChurchList(el, churches){
  el.innerHTML = `<div class="church-list">${churches.map(c=>`
    <div class="church-item">
      <div style="flex:1">
        <div class="church-name">${esc(c.name)}</div>
        <div class="church-detail">${esc(c.address||'')} ${esc(c.city||'')} · <span class="badge badge-blue" style="font-size:10px">${esc(c.denomination||'Cristiana')}</span></div>
        ${c.phone?`<div style="font-size:12px;color:var(--gold);margin-top:2px">${esc(c.phone)}</div>`:''}
      </div>
      <a href="https://www.google.com/maps/search/${encodeURIComponent(c.name+' '+c.city)}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="text-decoration:none">${t('churchMap')}</a>
    </div>`).join('')}
  </div>`;
}

async function submitChurchRegister(){
  const name     = document.getElementById('ch-name')?.value.trim();
  const city     = document.getElementById('ch-city')?.value.trim();
  const country  = document.getElementById('ch-country')?.value.trim();
  const email    = document.getElementById('ch-email')?.value.trim();
  const pastor   = document.getElementById('ch-pastor')?.value.trim();
  const addr     = document.getElementById('ch-addr')?.value.trim();
  const phone    = document.getElementById('ch-phone')?.value.trim();
  const denom    = document.getElementById('ch-denom')?.value.trim();
  const isEs     = state.lang==='es';

  if(!name||!city||!country||!email){
    showToast(isEs?'Nombre, ciudad, país y email son requeridos':'Name, city, country and email are required');
    return;
  }
  const btn = document.getElementById('ch-submit-btn');
  if(btn){ btn.disabled=true; btn.textContent='...'; }

  try {
    await fetch(`${CF}/church-register`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name,city,country,address:addr,phone,pastor_name:pastor,pastor_email:email,denomination:denom,user_id:state.user?.id })
    });
    document.getElementById('ch-submit-ok').style.display='block';
    if(btn) btn.style.display='none';
    showToast(isEs?'¡Iglesia enviada para revisión!':'Church submitted for review!');
  } catch {
    if(btn){ btn.disabled=false; btn.textContent=isEs?'Enviar para validación':'Submit for validation'; }
    showToast(isEs?'Error al enviar, intenta de nuevo':'Error sending, please try again');
  }
}

// AUTH HANDLERS
// ══════════════════════════════════
async function handleAuth(type){
  const email = document.getElementById(`ae-${type}`)?.value.trim();
  const pass  = document.getElementById(`ap-${type}`)?.value.trim();
  const err   = document.getElementById(`ae-err-${type}`);
  const btn   = document.getElementById(`ab-${type}`);
  if(!email||!pass||pass.length<6){
    if(err){err.style.display='block';err.textContent=t('authLoginError');} return;
  }
  if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    if(type==='login'){
      const {data,error} = await db.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      const profile = await loadProfile(data.user.id);
      state.user={
        id:data.user.id, email,
        name:profile?.full_name||email.split('@')[0],
        plan:profile?.plan||'free',
        streak:profile?.streak||0,
        account_type:profile?.account_type||'adult',
        coins:profile?.coins||0,
        extra_msgs:profile?.extra_msgs||0,
        joined_at:profile?.created_at||new Date().toISOString(),
        quiz_avg:profile?.quiz_avg||0,
      };
      state.streak = state.user.streak;
      state.lang   = profile?.lang||state.lang;
      await countMsgsThisMonth(data.user.id);
      navigate('app'); navigateApp('home');
    } else {
      const name = document.getElementById('an-inp')?.value.trim();
      const accountType = document.getElementById('atype')?.value||'adult';
      if(!name){if(err){err.style.display='block';err.textContent=t('authLoginError');} return;}
      const {data,error} = await db.auth.signUp({
        email,password:pass,
        options:{data:{full_name:name,account_type:accountType,lang:state.lang}}
      });
      if(error) throw error;
      // Crear perfil en Supabase
      await db.from('profiles').upsert({
        id:data.user.id, email, full_name:name,
        plan:'free', streak:0, coins:0, extra_msgs:0,
        account_type:accountType, lang:state.lang,
        created_at:new Date().toISOString()
      },{onConflict:'id'});
      state.user={id:data.user.id,email,name,plan:'free',streak:0,account_type:accountType,coins:0,extra_msgs:0,joined_at:new Date().toISOString(),quiz_avg:0};
      state.msgThisMonth=0;
      // Email bienvenida (no bloqueante)
      fetch(`${CF}/welcome`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,name,lang:state.lang})}).catch(()=>{});
      showToast(t('authSignupSuccess'));
      navigate('app'); navigateApp('home');
    }
  }catch(e){
    if(err){err.style.display='block';err.textContent=e.message||t('authLoginError');}
  }finally{
    if(btn){btn.disabled=false;btn.textContent=type==='login'?t('authLoginBtn'):t('authSignupBtn');}
  }
}

function toggleMode(){
  state.mode=state.mode==='adult'?'kids':'adult';
  document.body.classList.toggle('kids-mode',state.mode==='kids');
  const mb=document.getElementById('app-mode'); if(mb) mb.textContent=state.mode==='kids'?t('switchToAdult'):t('switchToKids');
  const ml=document.getElementById('app-tag'); if(ml) ml.textContent=state.mode==='kids'?(state.lang==='en'?'KIDS MODE ⭐':'MODO NIÑOS ⭐'):t('appTagline');
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=buildSidebar();
  navigateApp('home');
}

function toggleLang(){
  state.lang=state.lang==='es'?'en':'es';
  rebuildUI();
}

function rebuildUI(){
  const isEN=state.lang==='en';
  const langLabel=isEN?'🌐 ES':'🌐 EN';
  document.querySelectorAll('#l-lang,#app-lang,#pp-lang').forEach(b=>{if(b)b.textContent=langLabel;});
  // Landing
  const set=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  set('l-tag','appTagline'); set('l-pnav','pricing'); set('l-si','signIn'); set('l-su','signUp');
  set('l-eyebrow','heroEyebrow'); set('l-ht','heroTitle'); // can't set with child; do:
  const lht=document.getElementById('l-ht'); if(lht) lht.innerHTML=`${t('heroTitle')}<em id="l-hti">${t('heroTitleItalic')}</em>`;
  set('l-hsub','heroSub'); set('l-ba','enterAdult'); set('l-bk','enterKids');
  set('l-am','adultMode'); set('l-ad','adultDesc'); set('l-km','kidsMode'); set('l-kd','kidsDesc');
  set('l-s1','marketUsers'); set('l-s2','marketBooks'); set('l-s3','marketQuestions');
  for(let i=1;i<=6;i++){set(`l-ft${i}`,`featTitle${i}`);set(`l-fd${i}`,`featDesc${i}`);}
  set('l-footer','footer');
  // pricing strip on landing
  set('l-ptitle','pricingTitle'); set('l-psub','pricingSub');
  const lpc=document.getElementById('l-pcards'); if(lpc) lpc.innerHTML=renderPricingCards(getPricingPlans(),true);
  // auth
  const setAuth=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  ['login','signup'].forEach(type=>{
    setAuth(`at-tag-${type}`,type==='login'?'authLoginTagline':'authSignupTagline');
    setAuth(`al-email-${type}`,'authEmail'); setAuth(`al-pass-${type}`,'authPass');
    setAuth(`ab-${type}`,type==='login'?'authLoginBtn':'authSignupBtn');
    setAuth(`as-${type}`,type==='login'?'authGoSignup':'authGoLogin');
    setAuth(`ab2-${type}`,'authBack'); setAuth(`al-hint-${type}`,'authHint');
  });
  setAuth('al-name','authName'); setAuth('al-type','authAccountType');
  const at=document.getElementById('atype');
  if(at){at.options[0].text=t('authTypeAdult');at.options[1].text=t('authTypeKids');at.options[2].text=t('authTypeFamily');at.options[3].text=t('authTypeChurch');}
  // app nav
  setAuth('app-tag','appTagline'); setAuth('app-mode',state.mode==='kids'?'switchToAdult':'switchToKids');
  setAuth('app-crisis','emergencyBtn'); setAuth('app-so','signOut');
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=buildSidebar();
  // pricing page
  setAuth('pp-title','pricingTitle'); setAuth('pp-sub','pricingSub');
  const ppc=document.getElementById('pp-cards'); if(ppc) ppc.innerHTML=renderPricingCards(getPricingPlans(),false);
  // crisis modal
  setAuth('cm-t','crisisTitle'); setAuth('cm-s','crisisSub'); setAuth('cm-a','crisisAlso');
  setAuth('cm-call','crisisCall'); setAuth('cm-close','crisisClose');
  // re-render current app page
  if(state.page==='app') navigateApp(_currentPage);
}

// ══════════════════════════════════
// UI UTILS
// ══════════════════════════════════
function showCrisis(){document.getElementById('crisis-modal')?.classList.add('show');}
function hideCrisis(){document.getElementById('crisis-modal')?.classList.remove('show');}
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function attachGlobalEvents(){
  document.getElementById('crisis-modal')?.addEventListener('click',function(e){if(e.target===this)hideCrisis();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCrisis();});
}
