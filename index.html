  <style>
/* ═══════════════════════════════════════════
   MYFATHER — Design System
   Aesthetic: Sacred luxury — dark vellum,
   gold leaf, ancient manuscript meets modern
   ═══════════════════════════════════════════ */

:root {
  --ink:       #1a1410;
  --parchment: #f5f0e8;
  --vellum:    #ede7d5;
  --gold:      #c9973a;
  --gold-lt:   #e8c97a;
  --gold-dk:   #8a6420;
  --crimson:   #8b1a1a;
  --azure:     #1a4a8b;
  --sage:      #3d6b4f;
  --pearl:     #faf8f3;
  --shadow:    rgba(26,20,16,0.18);

  /* Kids palette */
  --kids-sky:    #6bbde3;
  --kids-sun:    #ffd166;
  --kids-grass:  #78c87a;
  --kids-cloud:  #f0f4ff;
  --kids-warm:   #ff8c69;

  --font-display: 'Cinzel', serif;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', sans-serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;

  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--parchment);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dk); border-radius: 3px; }

/* ══════════════════════════════════
   LAYOUT
══════════════════════════════════ */
#app { min-height: 100vh; }

.page { display: none; min-height: 100vh; }
.page.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════
   COMPONENTS — Buttons
══════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 12px 28px; border-radius: 40px;
  border: none; cursor: pointer;
  transition: var(--transition); text-decoration: none;
  letter-spacing: 0.03em;
}
.btn-gold {
  background: var(--gold);
  color: var(--ink);
}
.btn-gold:hover { background: var(--gold-lt); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,151,58,0.35); }

.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}
.btn-outline:hover { background: rgba(201,151,58,0.1); }

.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,0.12);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }

.btn-danger {
  background: var(--crimson); color: white;
}
.btn-sm { padding: 8px 18px; font-size: 13px; }
.btn-lg { padding: 16px 40px; font-size: 16px; }

/* ══════════════════════════════════
   COMPONENTS — Cards
══════════════════════════════════ */
.card {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(201,151,58,0.45);
  background: rgba(245,240,232,0.08);
}
.card-gold {
  background: linear-gradient(135deg, rgba(201,151,58,0.15), rgba(138,100,32,0.08));
  border-color: rgba(201,151,58,0.4);
}

/* ══════════════════════════════════
   COMPONENTS — Badge
══════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase;
}
.badge-gold { background: rgba(201,151,58,0.2); color: var(--gold-lt); border: 1px solid rgba(201,151,58,0.3); }
.badge-green { background: rgba(61,107,79,0.3); color: #7ecfa0; border: 1px solid rgba(61,107,79,0.4); }
.badge-red { background: rgba(139,26,26,0.3); color: #f08080; border: 1px solid rgba(139,26,26,0.4); }
.badge-blue { background: rgba(26,74,139,0.3); color: #7ab0f0; border: 1px solid rgba(26,74,139,0.4); }
.badge-kids { background: rgba(107,189,227,0.2); color: var(--kids-sky); border: 1px solid rgba(107,189,227,0.35); }

/* ══════════════════════════════════
   COMPONENTS — Inputs
══════════════════════════════════ */
.input-wrap { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 12px; color: rgba(245,240,232,0.5); letter-spacing: 0.04em; text-transform: uppercase; }

.input, .textarea, .select {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-sm);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 15px;
  padding: 12px 16px;
  transition: var(--transition);
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,240,232,0.09);
  box-shadow: 0 0 0 3px rgba(201,151,58,0.12);
}
.textarea { resize: vertical; min-height: 100px; }
.select { appearance: none; cursor: pointer; }

/* ══════════════════════════════════
   COMPONENTS — Navigation
══════════════════════════════════ */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid rgba(201,151,58,0.15);
  position: sticky; top: 0; z-index: 100;
  background: rgba(26,20,16,0.92);
  backdrop-filter: blur(20px);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px; color: var(--gold);
  letter-spacing: 0.1em; cursor: pointer;
  text-decoration: none;
}
.nav-logo span { color: var(--parchment); opacity: 0.5; font-size: 12px; display: block; letter-spacing: 0.2em; font-family: var(--font-body); font-weight: 300; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link {
  font-size: 13px; color: rgba(245,240,232,0.6);
  padding: 8px 14px; border-radius: 20px;
  cursor: pointer; transition: var(--transition);
  text-decoration: none; border: none; background: none; font-family: var(--font-body);
}
.nav-link:hover { color: var(--gold); background: rgba(201,151,58,0.08); }
.nav-link.active { color: var(--gold); }

/* ══════════════════════════════════
   LANDING PAGE
══════════════════════════════════ */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 80px 40px;
  position: relative; overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(201,151,58,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139,26,26,0.08) 0%, transparent 60%);
}

.hero-cross {
  width: 48px; height: 48px;
  margin: 0 auto 32px;
  opacity: 0.7;
}

.hero-eyebrow {
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1.05; color: var(--parchment);
  margin-bottom: 12px;
}
.hero-title em { color: var(--gold); font-style: italic; font-family: var(--font-serif); }

.hero-sub {
  font-family: var(--font-serif);
  font-size: clamp(18px, 2.5vw, 24px);
  color: rgba(245,240,232,0.55);
  font-style: italic; margin-bottom: 48px;
  max-width: 520px;
}

.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.hero-modes {
  display: flex; gap: 20px; margin-top: 64px;
  justify-content: center; flex-wrap: wrap;
}
.mode-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl);
  padding: 32px 28px; width: 240px; cursor: pointer;
  transition: var(--transition); text-align: center;
}
.mode-card:hover {
  transform: translateY(-4px);
  border-color: rgba(201,151,58,0.5);
  background: rgba(201,151,58,0.08);
  box-shadow: 0 20px 40px rgba(201,151,58,0.12);
}
.mode-card.kids { border-color: rgba(107,189,227,0.3); }
.mode-card.kids:hover { border-color: var(--kids-sky); background: rgba(107,189,227,0.08); }
.mode-emoji { font-size: 40px; margin-bottom: 14px; }
.mode-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.mode-card.kids .mode-title { color: var(--kids-sky); }
.mode-desc { font-size: 13px; color: rgba(245,240,232,0.5); line-height: 1.6; }

/* ══════════════════════════════════
   DASHBOARD
══════════════════════════════════ */
.dashboard { flex: 1; display: flex; }
.sidebar {
  width: 260px; min-height: calc(100vh - 73px);
  border-right: 1px solid rgba(201,151,58,0.12);
  padding: 28px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-section {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); padding: 16px 12px 6px; font-weight: 500;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition);
  font-size: 14px; color: rgba(245,240,232,0.6);
  border: none; background: none; font-family: var(--font-body);
  width: 100%; text-align: left;
}
.sidebar-item svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
.sidebar-item:hover { background: rgba(201,151,58,0.08); color: var(--gold); }
.sidebar-item:hover svg { opacity: 1; }
.sidebar-item.active { background: rgba(201,151,58,0.12); color: var(--gold); font-weight: 500; }
.sidebar-item.active svg { opacity: 1; }
.sidebar-badge { margin-left: auto; font-size: 10px; background: var(--crimson); color: white; padding: 2px 6px; border-radius: 10px; }

.main-content { flex: 1; padding: 36px 40px; overflow-y: auto; }
.page-header { margin-bottom: 32px; }
.page-header h1 { font-family: var(--font-serif); font-size: 32px; font-weight: 300; color: var(--parchment); margin-bottom: 4px; }
.page-header p { font-size: 14px; color: rgba(245,240,232,0.45); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: rgba(245,240,232,0.04); border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-md); padding: 20px;
}
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,240,232,0.4); margin-bottom: 8px; }
.stat-value { font-family: var(--font-serif); font-size: 36px; color: var(--gold); line-height: 1; }
.stat-sub { font-size: 12px; color: rgba(245,240,232,0.4); margin-top: 4px; }

/* ══════════════════════════════════
   AI CHAT
══════════════════════════════════ */
.chat-container {
  display: flex; flex-direction: column;
  height: calc(100vh - 160px); max-width: 760px; margin: 0 auto;
}
.chat-mode-bar {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.mode-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(245,240,232,0.15);
  background: transparent; cursor: pointer;
  font-size: 13px; color: rgba(245,240,232,0.5);
  font-family: var(--font-body); transition: var(--transition);
}
.mode-pill.active {
  border-color: var(--gold); color: var(--gold);
  background: rgba(201,151,58,0.1);
}
.mode-pill.kids-mode.active {
  border-color: var(--kids-sky); color: var(--kids-sky);
  background: rgba(107,189,227,0.1);
}

.chat-messages {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 4px 2px; padding-bottom: 20px;
}
.message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
.message.user { flex-direction: row-reverse; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  border: 1px solid rgba(201,151,58,0.3);
  background: rgba(201,151,58,0.1);
}
.msg-bubble {

// Límites por plan (deben coincidir con la tabla plan_limits en Supabase — solo se usan para mostrar un estimado, el límite real lo aplica el servidor)
const PLAN_LIMITS = { free:15, basic:80, premium:300, family:500, church:1200 };
function msgLimit(){ return PLAN_LIMITS[state.user?.plan||'free']||5; }
function msgsLeft(){
  const extra = state.user?.extra_msgs||0;
  return Math.max(0, msgLimit() + extra - state.msgThisMonth);
}
function canChat(){ return state.user && msgsLeft() > 0; }

// ── Días desde que se unió el usuario ──
function daysSinceJoined(){
  if(!state.user?.joined_at) return 0;
  return Math.floor((Date.now()-new Date(state.user.joined_at))/(1000*60*60*24));
}

// ── Supabase helpers ──
async function loadProfile(uid){
  const { data } = await db.from('profiles').select('*').eq('id',uid).single();
  return data;
}
async function countMsgsThisMonth(uid){
  // Lee el conteo real que lleva el servidor (tabla ai_usage) — solo cuenta mensajes de Capa 2/3 (los que sí cuestan)
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  try {
    const { data } = await db.from('ai_usage').select('msgs_used')
      .eq('user_id',uid).eq('profile_type','adult').eq('period_start',start.toISOString().slice(0,10)).maybeSingle();
    state.msgThisMonth = data?.msgs_used||0;
  } catch{ state.msgThisMonth=0; }
}
async function loadContentFromDB(){
  try {
    const day = Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
    const week = Math.ceil(day/7);
    const [vRes,qRes,dRes,rRes,lRes] = await Promise.all([
      db.from('daily_verses').select('*').eq('day_of_year',day).single(),
      db.from('quiz_questions').select('*').limit(40),
      db.from('devotionals').select('*').eq('week_num',week).single(),
      db.from('reading_plan').select('*').eq('day_num',day).single(),
      db.from('lessons_content').select('*').order('order_num'),
    ]);
    if(vRes.data) state.contentCache.verse = vRes.data;
    if(qRes.data?.length) state.contentCache.quiz = qRes.data;
    if(dRes.data) state.contentCache.devotional = dRes.data;
    if(rRes.data) state.contentCache.reading = rRes.data;
    if(lRes.data?.length) state.lessons = lRes.data;
  } catch(e){ console.warn('DB content fallback:', e?.message); }
}

async function loadLessonProgress(){
  if(!state.user) return;
  const { data } = await db.from('lesson_progress').select('lesson_id,progress,completed,created_at').eq('user_id',state.user.id);
  state.lessonProgress = {};
  (data||[]).forEach(p=>{ state.lessonProgress[p.lesson_id] = p; });
}

const LESSON_LIMITS = {}; // lecciones nuevas por mes; el resto de planes no tiene límite
function lessonsStartedThisMonth(){
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  return Object.values(state.lessonProgress||{}).filter(p=>new Date(p.created_at)>=start).length;
}
function canStartNewLesson(slug){
  if(state.lessonProgress?.[slug]) return true; // ya empezada, siempre se puede continuar/repasar
  const limit = LESSON_LIMITS[state.user?.plan||'free'];
  if(limit===undefined) return true;
  return lessonsStartedThisMonth() < limit;
}

async function hydrateSession(session){
  state.supaSession = session;
  let profile = await loadProfile(session.user.id);
  if(!profile){
    // Primer login (ej. Google OAuth) — aún no existe fila en profiles
    const meta = session.user.user_metadata||{};
    await db.from('profiles').upsert({
      id: session.user.id,
      full_name: meta.full_name||meta.name||session.user.email?.split('@')[0]||'MyFather',
      account_type: ['adult','family','church','kids'].includes(meta.account_type)?meta.account_type:'adult', lang: state.lang, birthdate:meta.birthdate||null,
    },{onConflict:'id'});
    profile = await loadProfile(session.user.id);
  }
  if(profile){
    state.user = {
      id:           session.user.id,
      email:        session.user.email,
      name:         profile.full_name,
      plan:         profile.plan||'free',
      streak:       profile.streak||0,
      account_type: profile.account_type||'adult',
      coins:        profile.coins||0,
      extra_msgs:   profile.extra_msgs||0,
      joined_at:    profile.created_at,
      quiz_avg:     profile.quiz_avg||0,
      birthdate:    profile.birthdate||null,
    };
    state.streak = profile.streak||0;
    state.lang   = profile.lang||state.lang;
    document.documentElement.lang = state.lang;
    await countMsgsThisMonth(session.user.id);
    await loadChildProfiles();
    await loadLessonProgress();
  }
}

async function initSupabase(){
  const { data:{session} } = await db.auth.getSession();
  if(session) await hydrateSession(session);
  if(state.user) await loadContentFromDB();
  buildApp();
  // Navegar según si hay sesión activa o no
  if(state.user){
    navigate('app');
    navigateApp('home');
    if(state.mode==='adult'&&!state.user.birthdate) showOnboarding();
  } else {
    navigate('landing');
  }
}

let _authHandled=false;
db.auth.onAuthStateChange((event,session)=>{
  if(event==='TOKEN_REFRESHED')state.supaSession=session;
  setTimeout(async()=>{
    if(event==='PASSWORD_RECOVERY'){showPasswordRecovery();return;}
    if(event==='SIGNED_OUT'){closeLesson();state.user=null;state.supaSession=null;state.mode='adult';state.lessons=[];state.questions=[];state.childProfiles=[];state.chatHistory=[];navigate('login');return;}
    if(!session||_authHandled||!['SIGNED_IN','INITIAL_SESSION'].includes(event)||state.user)return;
    _authHandled=true;
    try{await hydrateSession(session);if(!document.getElementById('page-app'))buildApp();navigate('app');navigateApp('home');applyMode();if(state.mode==='adult'&&!state.user.birthdate)showOnboarding();}
    catch(e){showToast(e.message||'No se pudo cargar la sesión.');}
    finally{_authHandled=false;}
  },0);
});

function navigate(page){
  if(page==='app' && !state.user){ navigate('login'); return; }
  if(state.mode==='kids'&&state.user&&page!=='app'){showToast('Cierra la sesión infantil para entrar como adulto.');return;}
  state.page=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  window.scrollTo(0,0);
}

let _currentPage = 'home';
function navigateApp(pg){
  if(!state.user){ navigate('login'); return; }
  if(state.mode==='kids'&&!['home','lessons','quiz','haven','chat'].includes(pg)){pg='lessons';}
  _currentPage = pg;
  const map = {
    home:buildHome, chat:buildChat, lessons:buildLessons,
    devotional:buildDevotional, reading:buildReading,
    quiz:buildQuiz, haven:buildHaven, churches:buildChurches, store:buildStore,
    security:buildSecurity
  };
  const mc = document.getElementById('main-content');
  if(!mc) return;
  mc.innerHTML = (map[pg]||buildHome)();
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.toggle('active',i.dataset.page===pg));
  if(pg==='chat') setupChatEvents();
  window.scrollTo(0,0);
  // Upgrade prompt a los 14 días en plan free
  if(state.user?.plan==='free' && daysSinceJoined()>=14 && pg==='home'){
    setTimeout(showUpgradePrompt, 800);
  }
}

function showUpgradePrompt(){
  // Solo mostrar 1 vez por sesión
  if(window.__upgradeShown) return;
  window.__upgradeShown = true;
  const isEs = state.lang==='es';
  const box = document.createElement('div');
  box.id = 'upgrade-modal';
  box.style.cssText = 'position:fixed;inset:0;background:rgba(26,20,16,0.88);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px';
  box.innerHTML = `<div style="background:#1e1810;border:1px solid rgba(201,151,58,0.4);border-radius:var(--radius-xl);padding:40px;max-width:420px;width:100%;text-align:center">
    <div style="font-size:48px;margin-bottom:16px">✝️</div>
    <h2 style="font-family:var(--font-display);color:var(--gold);font-size:22px;margin-bottom:10px">${isEs?'14 días juntos':'14 days together'}</h2>
    <p style="font-size:15px;color:rgba(245,240,232,0.7);line-height:1.7;margin-bottom:24px">
      ${isEs
        ?`Llevas ${daysSinceJoined()} días explorando la Palabra. El plan Fe cuesta $3 USD por 30 días e incluye 80 mensajes IA al mes y todas las lecciones.`
        :`You've spent ${daysSinceJoined()} days exploring the Word. The Faith plan costs $3 USD for 30 days and includes 80 AI messages per month and all lessons.`}
    </p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="navigate('pricing-page');document.getElementById('upgrade-modal')?.remove()">
        ${isEs?'Ver planes →':'See plans →'}
      </button>
      <button class="btn btn-ghost" onclick="document.getElementById('upgrade-modal')?.remove()">
        ${isEs?'Quizás después':'Maybe later'}
      </button>
    </div>
  </div>`;
  document.body.appendChild(box);
  box.addEventListener('click',e=>{ if(e.target===box) box.remove(); });
}

const ABUSE_KW=['me golpea','me pega','me toca','me hace daño','me abusa','abuse','hitting me','touching me','hurts me','me viola','rape','violated','molest','robé','robamos','ilegal','illegal'];
function detectCrisis(txt){
  const l=txt.toLowerCase();

function getCapa1(txt){
  const pool = PREP[state.lang==='en'?'en':'es']||PREP.es;
  const lower = txt.toLowerCase();
  for(const e of pool){ if(e.p.test(lower)) return e.r(state.user?.name||''); }
  return null;
}

// Keywords que activan DeepSeek (preguntas teológicas profundas)
const DEEP_KW = ['teodicea','predestinación','predestination','libre albedrío','free will','sufrimiento y dios','why does god allow','encarnación','escatología','expiación','atonement','hermenéutica','apologética','diferencia entre','compare','contradice','contradicción','qué dice la biblia sobre','what does the bible say about','explain','explica','profundamente','análisis','analiza'];

function needsDeep(txt){ return txt.length > 90 || DEEP_KW.some(k=>txt.toLowerCase().includes(k)); }

function renderMsg(reply, lid){
  const msgs = document.getElementById('chat-msgs');
  document.getElementById(lid)?.remove();
  const vm = reply.match(/["""]([^"""]{10,})["""]\s*[—–-]\s*(\S[^\n]{0,60})/);
  let main=esc(reply), vhtml='';
  if(vm){ vhtml=`<div class="msg-verse">${esc(vm[1])}<div class="msg-ref">— ${esc(vm[2])}</div></div>`; main=esc(reply.replace(vm[0],'')).trim(); }
  msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${main}${vhtml}</div></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat(){
  if(chatBusy) return;
  const inp = document.getElementById('chat-inp');
  const txt = inp.value.trim(); if(!txt) return;
  inp.value='';
  const msgs = document.getElementById('chat-msgs');
  if(!msgs) return;

  msgs.innerHTML += `<div class="message user"><div class="msg-avatar">👤</div><div><div class="msg-bubble">${esc(txt)}</div></div></div>`;

  // Crisis siempre primero
  const cr = detectCrisis(txt);
  if(cr){

    if(cr==='suicide'){ msgs.innerHTML+=crisisMsg(); msgs.scrollTop=msgs.scrollHeight; return; }
    if(cr==='abuse')  { msgs.innerHTML+=abuseMsg();  msgs.scrollTop=msgs.scrollHeight; return; }
  }

  // ── Capa 1: Respuesta preprogramada ──
  const capa1 = getCapa1(txt);
  if(capa1){
    const fake = 'l'+Date.now();
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:capa1});
    msgs.innerHTML += `<div class="message ai" id="${fake}"></div>`;
    renderMsg(capa1, fake);
    // Guardar en DB (no bloquear)

    return;
  }

  if(state.aiMode==='none'||state.mode==='kids'){
    const reply=state.lang==='es'?'No encontré una respuesta preparada. Puedes explorar las lecciones o elegir Poca IA para una explicación breve.':'I did not find a prepared answer. Explore lessons or select Brief AI.';
    const id='local-'+Date.now();msgs.innerHTML+=`<div class="message ai" id="${id}"></div>`;renderMsg(reply,id);return;
  }
  // ── Capa 2/3: se necesita sesión (el límite real lo aplica el servidor) ──
  if(!state.user){
    const isEs = state.lang==='es';
    msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${isEs?'Inicia sesión para hablar con el Tutor IA.':'Sign in to talk to the AI Tutor.'}</div></div></div>`;
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }

  // ── Capa 2/3: DeepSeek vía Worker ──
  const lid = 'l'+Date.now();
  msgs.innerHTML += `<div class="message ai" id="${lid}"><div class="msg-avatar">✝️</div><div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  chatBusy = true;

  const lng = state.lang==='en'?'English':'Spanish (español)';
  const userAge = ageFromBirthdate(state.user?.birthdate);
  const isTeen = state.mode!=='kids' && userAge!==null && userAge<18;
  const deep = state.aiMode==='deep' && !isTeen; // menores de 18 sin perfil de niño se quedan en Capa 2 (sin la capa "profunda" sin supervisión)
  const sys = state.mode==='kids'
    ? `You are a warm biblical guide for a child named ${state.activeChildName||''}, ages 4-12. Always respond in ${lng}. Use simple language and emojis ⭐🙏. NEVER inappropriate content. If danger, say to talk to a trusted adult. Max 3 short paragraphs.`
    : isTeen
    ? `You are a caring Christian biblical tutor for a teenager (13-17) on the MyFather app. Always respond in ${lng}. Cite Bible verses with exact references. Keep language age-appropriate, avoid explicit or mature content. If suicidal thoughts or danger, respond with love and include crisis resources immediately, and gently encourage talking to a trusted adult. Max 150 words.`
    : `You are a wise Christian biblical tutor for MyFather app. Always respond in ${lng}. Cite Bible verses with exact references. Be compassionate and deep. If suicidal thoughts, respond with love and include crisis resources immediately. Max ${deep?280:120} words.`;

  try{
    const r = await fetch(`${CF}/ai/chat`,{
      method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(await db.auth.getSession()).data.session?.access_token},
      body:JSON.stringify({ai_mode:state.aiMode,lang:state.lang,layer:deep?3:2,system:sys,messages:[...state.chatHistory.slice(-6),{role:'user',content:txt}],max_tokens:deep?500:180,user_id:state.user.id,profile_type:state.activeChildId?'child':'adult'})
    });
    if(r.status===429){
      document.getElementById(lid)?.remove();
      const isEs = state.lang==='es';
      msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">
        ${isEs?'Has usado todos tus mensajes IA de este mes. Puedes comprar más o actualizar tu plan.':"You've used all your AI messages this month. Buy more or upgrade your plan."}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn btn-gold btn-sm" onclick="navigate('pricing-page')">${isEs?'Ver planes →':'See plans →'}</button>
          <button class="btn btn-outline btn-sm" onclick="navigateApp('store')">${isEs?'Comprar mensajes':'Buy messages'}</button>
        </div>
      </div></div></div>`;
      msgs.scrollTop = msgs.scrollHeight;
      chatBusy=false;
      return;
    }
    if(!r.ok) throw new Error(`Worker ${r.status}`);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    const reply = d.content?.[0]?.text || (state.lang==='en'?'Could not get a response.':'No se pudo obtener respuesta.');
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:reply});
    renderMsg(reply, lid);
    // Guardar en DB

  }catch(e){
    document.getElementById(lid)?.remove();
    const isEs = state.lang==='es';
    msgs.innerHTML += `<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble" style="color:rgba(245,240,232,0.5)">${isEs?'Hubo un problema de conexión. Intenta de nuevo.':'Connection issue. Please try again.'}</div></div></div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }
  chatBusy=false;
  msgs.scrollTop = msgs.scrollHeight;
}

const LEVEL_LABEL = {
  basic:{es:'Básico',en:'Basic'}, intermediate:{es:'Intermedio',en:'Intermediate'}, advanced:{es:'Avanzado',en:'Advanced'}
};

function buildLessons(){
  const isEs = state.lang==='es';
  const isK = state.mode==='kids';
  const list = (state.lessons||[]).filter(l=>l.is_kids===isK);
  if(!list.length){
    return `<div class="page-header"><h1>${t('lessonsTitle')}</h1><p>${isK?t('lessonsKidsSub'):t('lessonsAdultSub')}</p></div><div class="empty">${isEs?'Cargando lecciones...':'Loading lessons...'}</div>`;
  }
  return `<div class="page-header"><h1>${t('lessonsTitle')}</h1><p>${isK?t('lessonsKidsSub'):t('lessonsAdultSub')}</p></div>
<div class="lessons-grid">
${list.map(l=>{
  const prog = state.lessonProgress?.[l.slug];
  const pct = prog?.completed?100:(prog?.progress||0);
  const locked = !canStartNewLesson(l.slug);
  const level = (LEVEL_LABEL[l.level]||{})[state.lang] || l.level;
  const btnLabel = locked ? (isEs?'🔒 Límite mensual':'🔒 Monthly limit') : pct===100?t('lessonRepeat'):pct>0?t('lessonContinue'):t('lessonStart');
  return `<div class="lesson-card ${isK?'kids-card':''}">
  <div class="lesson-thumb"><span style="position:relative;z-index:1;font-size:52px">${esc(l.emoji)}</span>
  ${pct===100?`<div style="position:absolute;top:10px;right:10px;background:rgba(61,107,79,0.85);color:#7ecfa0;font-size:11px;padding:3px 8px;border-radius:10px">${t('lessonDone')}</div>`:''}
  ${pct>0&&pct<100?`<div style="position:absolute;top:10px;right:10px;background:rgba(201,151,58,0.85);color:var(--ink);font-size:11px;padding:3px 8px;border-radius:10px">${t('lessonProgress')}</div>`:''}
  </div>
  <div class="lesson-body">
    <div class="lesson-title">${esc(state.lang==='en'?l.title_en:l.title_es)}</div>
    <div class="lesson-meta"><span>⏱ ${l.duration_min} min</span><span>📊 ${esc(level)}</span></div>
    <div class="lesson-progress"><div class="lesson-progress-fill" style="width:${pct}%"></div></div>
    <button class="btn ${locked?'btn-outline':'btn-gold'} btn-sm" style="margin-top:14px;width:100%;justify-content:center" ${locked?`onclick="navigate('pricing-page')"`:`onclick="openLesson('${esc(l.slug)}')"`}>
      ${btnLabel}
    </button>
  </div>
</div>`;}).join('')}
</div>`;
}

// ══════════════════════════════════
// VISOR DE LECCIONES
// ══════════════════════════════════
let _lessonState = null;

function openLesson(slug){
  const l = (state.lessons||[]).find(x=>x.slug===slug);
  if(!l||l.is_kids!==(state.mode==='kids')) return;
  if(!canStartNewLesson(slug)){ navigate('pricing-page'); return; }
  const steps = (state.lang==='en'?l.steps_en:l.steps_es)||[];
  const prevProgress = state.lessonProgress?.[slug];
  const startStep = prevProgress && !prevProgress.completed ? Math.min(Math.floor((prevProgress.progress/100)*steps.length), steps.length-1) : 0;
  _lessonState = { slug, steps, idx: startStep };
  renderLessonView();
}

function closeLesson(){ document.getElementById('lesson-overlay')?.remove(); _lessonState=null; }

function renderLessonView(){
  if(!_lessonState) return;
  const { steps, idx } = _lessonState;
  const s = steps[idx];
  const isEs = state.lang==='es';
  const isLast = idx===steps.length-1;
  let body = '';
  if(s.type==='verse'){
    body = `<div class="msg-verse" style="font-size:17px;padding:20px">${esc(s.text)}<div class="msg-ref">— ${esc(s.ref)}</div></div>`;
  } else {
    body = `<h3 style="color:var(--gold);font-family:var(--font-serif);font-size:20px;margin-bottom:10px">${esc(s.title||'')}</h3><p style="line-height:1.8;color:rgba(245,240,232,0.85)">${esc(s.body||'')}</p>`;
    if(s.question) body += `<div style="margin-top:18px;padding:14px;background:rgba(201,151,58,0.08);border-left:3px solid var(--gold);border-radius:0 8px 8px 0"><strong style="color:var(--gold)">${isEs?'Para reflexionar:':'To reflect:'}</strong><br>${esc(s.question)}</div>`;
  }
  if(s.media_id)body+=`<figure><img id="lesson-private-image" alt="${esc(s.alt||'')}" style="max-width:100%;border-radius:12px" hidden><figcaption id="lesson-image-status" style="font-size:13px">${isEs?'Cargando imagen…':'Loading image…'}</figcaption></figure>`;
  let overlay = document.getElementById('lesson-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'lesson-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,8,6,0.96);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div style="max-width:520px;width:100%;background:#1a1410;border:1px solid rgba(201,151,58,0.3);border-radius:20px;padding:32px;max-height:85vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div style="display:flex;gap:5px">${steps.map((_,i)=>`<div style="width:${i===idx?18:6}px;height:6px;border-radius:3px;background:${i<=idx?'var(--gold)':'rgba(245,240,232,0.15)'};transition:.2s"></div>`).join('')}</div>
      <button class="btn btn-ghost btn-sm" onclick="closeLesson()">✕</button>
    </div>
    <div>${body}</div>
    <div style="display:flex;gap:10px;margin-top:26px">
      ${idx>0?`<button class="btn btn-outline" onclick="lessonNav(-1)">${isEs?'← Atrás':'← Back'}</button>`:''}
      <button class="btn btn-gold" style="flex:1;justify-content:center" onclick="lessonNav(1)">${isLast?(isEs?'Terminar ✓':'Finish ✓'):(isEs?'Siguiente →':'Next →')}</button>
    </div>
  </div>`;
  if(s.media_id){
    const image=document.getElementById('lesson-private-image'),caption=document.getElementById('lesson-image-status'),view=_lessonState,mode=state.mode;
    api('/media?id='+encodeURIComponent(s.media_id)).then(data=>{if(_lessonState===view&&view.idx===idx&&state.mode===mode&&image.isConnected){image.src=data.url;image.hidden=false;caption.textContent='';}}).catch(()=>{if(caption.isConnected)caption.textContent=isEs?'La imagen no está disponible.':'Image unavailable.';});
  }
}

async function lessonNav(dir){
  if(!_lessonState) return;
  const { slug, steps, idx } = _lessonState;
  if(dir>0 && idx===steps.length-1){
    try{await saveLessonProgress(slug, 100, true);}catch(e){showToast(e.message);return;}
    showToast(state.lang==='es'?'✅ ¡Lección completada!':'✅ Lesson completed!');
    closeLesson();
    if(state.page==='app') navigateApp('lessons');
    return;
  }
  _lessonState.idx = Math.max(0, Math.min(steps.length-1, idx+dir));
  try{await saveLessonProgress(slug, Math.round(((_lessonState.idx+1)/steps.length)*100), false);}catch(e){showToast(e.message);return;}
  renderLessonView();
}

async function saveLessonProgress(slug, progress, completed){
  if(!state.user) return;
  const existing = state.lessonProgress?.[slug];
  const payload = { user_id:state.user.id, lesson_id:slug, progress, completed, updated_at:new Date().toISOString() };
  if(completed) payload.completed_at = new Date().toISOString();
  try{
    if(existing){
      await db.from('lesson_progress').update(payload).eq('user_id',state.user.id).eq('lesson_id',slug);
    } else {
      await db.from('lesson_progress').insert(payload);
    }
  } catch(e){ console.warn('lesson_progress save failed:', e?.message); }
  state.lessonProgress[slug] = { ...existing, ...payload, created_at: existing?.created_at||new Date().toISOString() };
}

function buildQuiz(){state.quizState={q:0,score:0,answered:false};if(!currentQuiz().length)return `<div class="card"><h1>${state.lang==='en'?'Practice activities':'Actividades para practicar'}</h1><p>${state.lang==='en'?'New activities are being prepared. You can continue with a lesson.':'Estamos preparando nuevas actividades. Puedes continuar con una lección.'}</p><button class="btn btn-gold" onclick="navigateApp('lessons')">${state.lang==='en'?'Lessons':'Lecciones'}</button></div>`;return renderQuizQ();}
function renderQuizQ(){
  const qs=currentQuiz();
  if(state.quizState.q>=qs.length) return renderQuizEnd();
  const q=qs[state.quizState.q];
  return `<div class="page-header"><h1>${t('quizTitle')}</h1><p>${t('quizSub')}</p></div>
<div class="quiz-streak">${ic('star')} ${t('quizStreakLabel')} ${state.streak} · ${t('quizScoreLabel')} ${state.quizState.score}/${state.quizState.q}</div>
<div class="quiz-card">
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(state.quizState.q/qs.length)*100}%"></div></div>
  <div style="font-size:12px;color:rgba(245,240,232,0.35);margin-bottom:20px">${t('quizQuestion')} ${state.quizState.q+1} ${t('quizOf')} ${qs.length}</div>
  <div class="quiz-q">${esc(q.q)}</div>
  <div class="quiz-options" id="qopts">
    ${q.opts.map((o,i)=>`<div class="quiz-option" id="qo${i}" onclick="answerQuiz(${i})"><div class="quiz-letter">${'ABCD'[i]}</div><span>${esc(o)}</span></div>`).join('')}
  </div>
  <div id="qfb" style="margin-top:20px;display:none"></div>
</div>`;
}
function answerQuiz(idx){
  if(state.quizState.answered) return;
  state.quizState.answered=true;
  const qs=currentQuiz();
  const q=qs[state.quizState.q];
  document.getElementById(`qo${q.correct}`)?.classList.add('correct');
  if(idx!==q.correct) document.getElementById(`qo${idx}`)?.classList.add('wrong');
  else state.quizState.score++;
  const fb=document.getElementById('qfb'); if(!fb) return;
  fb.style.display='block';
  fb.innerHTML=`<div style="font-size:14px;color:rgba(245,240,232,0.6);margin-bottom:12px">${idx===q.correct?t('quizCorrect'):`${t('quizWrong')} <strong style="color:#7ecfa0">${esc(q.opts[q.correct])}</strong>`}</div>
  <div style="font-family:var(--font-serif);font-style:italic;font-size:14px;color:rgba(245,240,232,0.5);margin-bottom:14px">${t('quizRef')} ${esc(q.verse)}</div>
  <button class="btn btn-gold btn-sm" onclick="nextQuizQ()">${state.quizState.q+1<qs.length?t('quizNext'):t('quizFinish')}</button>`;
}
function nextQuizQ(){state.quizState.q++;state.quizState.answered=false;document.getElementById('main-content').innerHTML=renderQuizQ();}
function renderQuizEnd(){
  const total=currentQuiz().length;
  const pct=Math.round((state.quizState.score/total)*100);
  return `<div class="page-header"><h1>${t('quizCompleteTitle')}</h1></div>
<div class="quiz-card" style="text-align:center">
  <div style="font-size:64px;margin-bottom:20px">${pct>=80?'🏆':pct>=60?'⭐':'📖'}</div>
  <div style="font-family:var(--font-serif);font-size:36px;color:var(--gold);margin-bottom:8px">${state.quizState.score}/${total}</div>
  <div style="font-size:18px;margin-bottom:24px">${pct}% ${state.lang==='en'?'correct':'correcto'}</div>
  <div style="font-size:15px;color:rgba(245,240,232,0.5);line-height:1.7;margin-bottom:28px">${pct>=80?t('quizCompleteSub1'):t('quizCompleteSub2')}</div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-gold" onclick="navigateApp('quiz')">${t('quizRetry')}</button>
    <button class="btn btn-outline" onclick="navigateApp('chat')">${t('quizAsk')}</button>
  </div>
</div>`;
}

function loadChurchesByGPS(){
  const locEl = document.getElementById('ch-loc');
  const listEl = document.getElementById('ch-list');
  if(!locEl||!listEl) return;

  if(!navigator.geolocation){
    if(locEl) locEl.textContent = state.lang==='es'?'GPS no disponible':'GPS not available';
    renderChurchFallback(listEl);
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng} = pos.coords;
    if(locEl) locEl.innerHTML = `<strong style="color:var(--parchment)">${lat.toFixed(4)}, ${lng.toFixed(4)}</strong> — <a href="https://www.google.com/maps/search/iglesias+cristianas/@${lat},${lng},13z" target="_blank" rel="noopener" style="color:var(--gold)">${state.lang==='es'?'Ver en Google Maps':'View on Google Maps'}</a>`;
    // Intentar cargar desde Supabase (iglesias aprobadas)
    api('/churches').then(data=>{
      const rad=n=>n*Math.PI/180;
      const distance=c=>{if(c.lat==null||c.lng==null)return Infinity;const dlat=rad(Number(c.lat)-lat),dlng=rad(Number(c.lng)-lng);const a=Math.sin(dlat/2)**2+Math.cos(rad(lat))*Math.cos(rad(Number(c.lat)))*Math.sin(dlng/2)**2;return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));};
      if(data?.length)renderChurchList(listEl,data.sort((a,b)=>distance(a)-distance(b)).slice(0,20));else renderChurchFallback(listEl);
    }).catch(()=>renderChurchFallback(listEl));
  }, ()=>{
    if(locEl) locEl.textContent = state.lang==='es'?'Sin permiso de ubicación':'Location permission denied';
    renderChurchFallback(listEl);
  },{timeout:6000});
}

async function handleAuth(type){
  const email=document.getElementById('ae-'+type)?.value.trim();
  const password=document.getElementById('ap-'+type)?.value;
  const button=document.getElementById('ab-'+type),err=document.getElementById('ae-err-'+type);
  const isEs=state.lang==='es';
  if(!email||!password){err.style.display='block';err.textContent=isEs?'Completa el correo y la contraseña.':'Enter email and password.';return;}
  button.disabled=true;err.style.display='none';_authHandled=true;
  try{
    let result;
    if(type==='signup'){
      const name=document.getElementById('an-inp').value.trim(),birthdate=document.getElementById('an-bd').value;
      const account_type=document.getElementById('atype').value;
      const age=ageFromBirthdate(birthdate);
      if(!name||!birthdate||!Number.isFinite(age)||age<18||age>120)throw Error(isEs?'La cuenta debe crearla una persona adulta. Los menores usan un perfil supervisado.':'An adult must create the account. Minors use a supervised profile.');
      if(password.length<12)throw Error(isEs?'Usa una contraseña de al menos 12 caracteres.':'Use at least 12 characters.');
      result=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin,data:{full_name:name,birthdate,account_type,lang:state.lang}}});
      if(result.error)throw result.error;
      if(!result.data.session){showToast(isEs?'Confirma tu correo para iniciar sesión.':'Confirm your email before signing in.');navigate('login');return;}
    }else{
      result=await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;
      const {data:aal,error:aalError}=await db.auth.mfa.getAuthenticatorAssuranceLevel();if(aalError)throw aalError;
      if(aal?.nextLevel==='aal2'&&aal.currentLevel!=='aal2'){
        const {data:factors}=await db.auth.mfa.listFactors();const factor=factors?.totp?.find(f=>f.status==='verified');
        const code=prompt(isEs?'Código de tu aplicación de autenticación:':'Authenticator code:');
        if(!factor||!code)throw Error(isEs?'Completa la verificación en dos pasos.':'Complete two-factor verification.');
        const {error}=await db.auth.mfa.challengeAndVerify({factorId:factor.id,code:code.trim()});if(error)throw error;
      }
    }
    const {data:{session}}=await db.auth.getSession();await hydrateSession(session);
    buildApp();navigate('app');navigateApp('home');applyMode();
    if(state.mode==='adult'&&!state.user.birthdate)showOnboarding();
  }catch(e){err.style.display='block';err.textContent=e.message||'No se pudo iniciar sesión.';}
  finally{button.disabled=false;_authHandled=false;}
}

function ageFromBirthdate(bd){
  if(!bd) return null;
  const b=new Date(bd), n=new Date();
  let age=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) age--;
  return age;
}

let _mfaEnroll = null; // { id, secret, uri }

async function loadMfaFactors(){
  const { data } = await db.auth.mfa.listFactors();
  return (data?.totp||[]).filter(f=>f.status==='verified');
}

async function startMfaEnroll(){
  const { data, error } = await db.auth.mfa.enroll({ factorType:'totp' });
  const box = document.getElementById('mfa-box');
  if(error){ if(box) box.innerHTML = `<div style="color:#f08080;font-size:13px">${error.message}</div>`; return; }
  _mfaEnroll = { id:data.id, secret:data.totp.secret, uri:data.totp.uri };
  const isEs = state.lang==='es';
  if(box) box.innerHTML = `
    <div style="font-size:13px;color:rgba(245,240,232,0.6);margin-bottom:10px">${isEs?'Abre Google Authenticator, Authy, etc. y agrega esta clave manualmente (tipo "basada en tiempo"):':'Open Google Authenticator, Authy, etc. and add this key manually (time-based type):'}</div>
    <div style="font-family:monospace;font-size:15px;color:var(--gold);letter-spacing:.05em;word-break:break-all;background:rgba(245,240,232,0.06);border-radius:8px;padding:12px;margin-bottom:14px;user-select:all">${esc(_mfaEnroll.secret)}</div>
    <div class="input-wrap"><label class="input-label">${isEs?'Código de 6 dígitos':'6-digit code'}</label><input class="input" id="mfa-code" maxlength="6" placeholder="000000"></div>
    <div id="mfa-err" style="font-size:13px;color:#f08080;display:none;padding:6px 0"></div>
    <button class="btn btn-gold" onclick="confirmMfaEnroll()">${isEs?'Activar 2FA':'Enable 2FA'}</button>`;
}

async function confirmMfaEnroll(){
  const code = document.getElementById('mfa-code')?.value.trim();
  const err = document.getElementById('mfa-err');
  if(!code){ if(err){err.style.display='block';err.textContent=state.lang==='es'?'Ingresa el código.':'Enter the code.';} return; }
  const { data:ch, error:chErr } = await db.auth.mfa.challenge({ factorId:_mfaEnroll.id });
  if(chErr){ if(err){err.style.display='block';err.textContent=chErr.message;} return; }
  const { error:vErr } = await db.auth.mfa.verify({ factorId:_mfaEnroll.id, challengeId:ch.id, code });
  if(vErr){ if(err){err.style.display='block';err.textContent=state.lang==='es'?'Código incorrecto, intenta de nuevo.':'Incorrect code, try again.';} return; }
  toast(state.lang==='es'?'✅ 2FA activado':'✅ 2FA enabled');
  navigateApp('security');
}

async function disableMfa(factorId){
  if(!confirm(state.lang==='es'?'¿Desactivar la verificación en dos pasos?':'Disable two-factor verification?')) return;
  await db.auth.mfa.unenroll({ factorId });
  toast(state.lang==='es'?'2FA desactivado':'2FA disabled');
  navigateApp('security');
}

async function buildSecurityAsync(){
  const factors = await loadMfaFactors();
  const isEs = state.lang==='es';
  const box = document.getElementById('security-content');
  if(!box) return;
  if(factors.length){
    box.innerHTML = `<div class="card" style="max-width:420px">

      <div style="color:#7ecfa0;font-size:14px;margin-bottom:14px">✅ ${isEs?'Activada':'Enabled'}</div>
      <button class="btn btn-danger btn-sm" onclick="disableMfa('${factors[0].id}')">${isEs?'Desactivar':'Disable'}</button>
    </div>`;
  } else {
    box.innerHTML = `<div class="card" style="max-width:420px">
      <div class="card-title">${isEs?'Verificación en dos pasos':'Two-factor verification'}</div>
      <p style="font-size:13px;color:rgba(245,240,232,0.5);margin-bottom:14px">${isEs?'Agrega una capa extra de seguridad con una app como Google Authenticator o Authy.':'Add an extra layer of security with an app like Google Authenticator or Authy.'}</p>
      <div id="mfa-box"><button class="btn btn-gold" onclick="startMfaEnroll()">${isEs?'Activar 2FA':'Enable 2FA'}</button></div>
    </div>`;
  }
}

  document.querySelectorAll('#l-lang,#app-lang,#pp-lang').forEach(b=>{if(b)b.textContent=langLabel;});
  // Landing
  const set=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  set('l-tag','appTagline'); set('l-pnav','pricing'); set('l-si','signIn'); set('l-su','signUp');
  set('l-eyebrow','heroEyebrow'); set('l-ht','heroTitle'); // can't set with child; do:
  const lht=document.getElementById('l-ht'); if(lht) lht.innerHTML=`${t('heroTitle')}<em id="l-hti">${t('heroTitleItalic')}</em>`;
  set('l-hsub','heroSub'); set('l-ba','enterAdult'); set('l-bk','enterKids');
  set('l-am','adultMode'); set('l-ad','adultDesc'); set('l-km','kidsMode'); set('l-kd','kidsDesc');
  set('l-s1','marketUsers'); set('l-s2','marketBooks'); set('l-s3','marketQuestions');
  for(let i=1;i<=6;i++){set(`l-ft${i}`,`featTitle${i}`);set(`l-fd${i}`,`featDesc${i}`);}
  set('l-footer','footer');
  // pricing strip on landing
  set('l-ptitle','pricingTitle'); set('l-psub','pricingSub');
  const lpc=document.getElementById('l-pcards'); if(lpc) lpc.innerHTML=renderPricingCards(getPricingPlans(),true);
  // auth
  const setAuth=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  ['login','signup'].forEach(type=>{
    setAuth(`at-tag-${type}`,type==='login'?'authLoginTagline':'authSignupTagline');
    setAuth(`al-email-${type}`,'authEmail'); setAuth(`al-pass-${type}`,'authPass');
    setAuth(`ab-${type}`,type==='login'?'authLoginBtn':'authSignupBtn');
    setAuth(`as-${type}`,type==='login'?'authGoSignup':'authGoLogin');
    setAuth(`ab2-${type}`,'authBack'); setAuth(`al-hint-${type}`,'authHint');
  });
  setAuth('al-name','authName'); setAuth('al-type','authAccountType');
  const at=document.getElementById('atype');
  if(at){at.options[0].text=t('authTypeAdult');at.options[1].text=t('authTypeFamily');at.options[2].text=t('authTypeChurch');}
  // app nav
  setAuth('app-tag','appTagline'); setAuth('app-mode',state.mode==='kids'?'switchToAdult':'switchToKids');
  setAuth('app-crisis','emergencyBtn'); setAuth('app-so','signOut');
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=buildSidebar();
  // pricing page
  setAuth('pp-title','pricingTitle'); setAuth('pp-sub','pricingSub');
  const ppc=document.getElementById('pp-cards'); if(ppc) ppc.innerHTML=renderPricingCards(getPricingPlans(),false);
  // crisis modal
  setAuth('cm-t','crisisTitle'); setAuth('cm-s','crisisSub'); setAuth('cm-a','crisisAlso');
  setAuth('cm-call','crisisCall'); setAuth('cm-close','crisisClose');
  // re-render current app page
  if(state.page==='app') navigateApp(_currentPage);
}

async function handleCheckout(plan){
  if(!state.user){ navigate('signup'); return; }
  if(state.mode==='kids'){showToast('Las compras son exclusivas del mundo adulto.');return;}
  if(plan==='free'){ showToast(state.lang==='es'?'Ya tienes acceso gratuito ✓':'You already have free access ✓'); return; }

  showToast(state.lang==='es'?'Conectando con MercadoPago...':'Connecting to MercadoPago...');
  try{
    const r = await fetch(`${CF}/mp/create-pref`,{
      method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(await db.auth.getSession()).data.session?.access_token},
      body: JSON.stringify({ plan, user_id: state.user.id, lang: state.lang })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    showCheckoutQuote(d);
  }catch(e){
    showToast(state.lang==='es'?'Error al conectar con MercadoPago':'MercadoPago connection error');
    console.error(e);
  }
}

async function buyItem(itemId){
  if(state.mode==='kids'){showToast('Las compras son exclusivas del mundo adulto.');return;}
  if(!state.user){ navigate('login'); return; }
  showToast(state.lang==='es'?'Procesando...':'Processing...');
  try{
    const r = await fetch(`${CF}/mp/store`,{
      method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+(await db.auth.getSession()).data.session?.access_token},
      body: JSON.stringify({ item_id: itemId, user_id: state.user.id })
    });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    showCheckoutQuote(d);
  }catch(e){
    showToast(state.lang==='es'?'Error al procesar':'Processing error');
  }
}

// UI UTILS

function showCrisis(){document.getElementById('crisis-modal')?.classList.add('show');}
function hideCrisis(){document.getElementById('crisis-modal')?.classList.remove('show');}
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');}
function attachGlobalEvents(){
  document.getElementById('crisis-modal')?.addEventListener('click',function(e){if(e.target===this)hideCrisis();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCrisis();});
}

// Manejar retorno de MercadoPago
(function(){
  const p = new URLSearchParams(window.location.search);
  const pay = p.get('payment');
  if(!pay) return;
  window.history.replaceState({},'',' ');
  setTimeout(()=>{
    if(pay==='success'){
      const plan = p.get('plan');
      const item = p.get('item');
      if(plan) showToast(state.lang==='es'?`Pago recibido para verificación. El plan se activa al confirmarlo Mercado Pago.`:`Payment returned for verification. The plan activates after Mercado Pago confirms it.`);
      else if(item) showToast(state.lang==='es'?'Verificando tu compra con Mercado Pago.':'Verifying your purchase with Mercado Pago.');
    } else if(pay==='failure'){
      showToast(state.lang==='es'?'El pago no se completó. Intenta de nuevo.':'Payment not completed. Please try again.');
    } else if(pay==='pending'){
      showToast(state.lang==='es'?'Pago pendiente — te avisaremos cuando se confirme.':'Payment pending — we\'ll notify you when confirmed.');
    }
  }, 1800);
})();

async function requestPasswordReset(){
  const email=document.getElementById('ae-login')?.value.trim();
  if(!email){showToast(state.lang==='es'?'Escribe primero tu correo.':'Enter your email first.');return;}
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/?recover=1'});
  showToast(error ? (state.lang==='es'?'No se pudo enviar el enlace. Intenta más tarde.':'Unable to send the link. Try later.') : (state.lang==='es'?'Si el correo está registrado, recibirás un enlace de recuperación.':'If the email is registered, you will receive a recovery link.'));
}
function showPasswordRecovery(){
  document.getElementById('password-recovery')?.remove();
  const el=document.createElement('div');el.id='password-recovery';
  el.style.cssText='position:fixed;inset:0;z-index:5000;background:#171410;display:grid;place-items:center;padding:24px';
  el.innerHTML=`<div class="auth-card"><h1>${state.lang==='es'?'Nueva contraseña':'New password'}</h1><label for="recovery-pass">${state.lang==='es'?'Al menos 12 caracteres':'At least 12 characters'}</label><input class="input" type="password" id="recovery-pass" autocomplete="new-password" minlength="12"><label for="recovery-confirm">${state.lang==='es'?'Repite la contraseña':'Repeat password'}</label><input class="input" type="password" id="recovery-confirm" autocomplete="new-password"><p id="recovery-error" role="alert"></p><button class="btn btn-gold" onclick="saveRecoveredPassword(this)">${state.lang==='es'?'Guardar contraseña':'Save password'}</button></div>`;
  document.body.appendChild(el);
}
async function saveRecoveredPassword(btn){
  const password=document.getElementById('recovery-pass').value;
  const errorEl=document.getElementById('recovery-error');
  if(password.length<12 || password!==document.getElementById('recovery-confirm').value){errorEl.textContent=state.lang==='es'?'Usa 12 caracteres o más y repite la misma contraseña.':'Use at least 12 characters and enter the same password twice.';return;}
  btn.disabled=true;
  try{
    const {error}=await db.auth.updateUser({password});if(error)throw error;
    await db.auth.signOut({scope:'global'});
    document.getElementById('password-recovery').remove();
    history.replaceState(null,'',location.pathname);state.user=null;state.supaSession=null;
    navigate('login');showToast(state.lang==='es'?'Contraseña actualizada. Inicia sesión de nuevo.':'Password updated. Sign in again.');
  }catch{errorEl.textContent=state.lang==='es'?'El enlace puede haber vencido. Solicita otro enlace e inténtalo de nuevo.':'The link may have expired. Request another link and retry.';}finally{btn.disabled=false;}
}

async function api(path,body){
  const {data:{session}}=await db.auth.getSession();
  if(!session)throw new Error('Inicia sesión de nuevo.');
  const response=await fetch(CF+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:body===undefined?undefined:JSON.stringify(body)});
  const result=await response.json();if(!response.ok)throw new Error(result.error||'No se pudo completar la operación.');return result;
}
async function hydrateSession(session){
  state.supaSession=session;
  // A locked child session must be resolved by the server before any adult data is loaded.
  let context;
  try{context=await api('/session');}catch(error){
    const p=await loadProfile(session.user.id);
    if(p)throw error;
    const meta=session.user.user_metadata||{};
    const {error:insertError}=await db.from('profiles').insert({id:session.user.id,full_name:meta.full_name||meta.name||'MyFather',account_type:['adult','family','church'].includes(meta.account_type)?meta.account_type:'adult',birthdate:meta.birthdate||null,lang:state.lang});
    if(insertError)throw insertError;
    context=await api('/session');
  }
  const p=context.profile;
  state.mode=context.mode;state.activeChildId=context.child_id;state.activeChildName=context.mode==='kids'?p.full_name:null;
  state.user={id:session.user.id,name:p.full_name,plan:p.plan||'free',streak:p.streak||0,coins:p.coins||0,account_type:p.account_type,extra_msgs:p.extra_msgs||0,joined_at:p.created_at,birthdate:p.birthdate||null};
  state.streak=p.streak||0;state.chatHistory=[];state.childProfiles=[];state.lessons=[];state.lessonProgress={};
  if(context.mode==='adult'){await loadChildProfiles();await countMsgsThisMonth(session.user.id);}
  await loadContentFromDB();await loadLessonProgress();applyMode();
}
async function loadContentFromDB(){
  if(!state.user)return;
  const data=await api('/content');state.lessons=data.lessons||[];state.questions=data.questions||[];
  if(state.page==='app'&&_currentPage==='lessons')navigateApp('lessons');
}
async function loadLessonProgress(){
  if(!state.user)return;
  const rows=await api('/progress');state.lessonProgress={};
  for(const p of rows)state.lessonProgress[p.lesson_id]={...p,completed:!!p.completed_at};
}
async function saveLessonProgress(slug,progress,completed){
  const result=await api('/progress',{slug,progress:completed?100:Math.min(99,progress),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'});
  state.lessonProgress[slug]={progress:completed?100:progress,completed};state.streak=result.streak;state.user.streak=result.streak;state.user.coins+=result.reward;
}
async function exitChildMode(){
  // The server lock cannot be removed by toggling a client flag. A new login is required.
  await signOut();showToast(state.lang==='es'?'Para entrar al mundo adulto, la persona responsable debe iniciar sesión de nuevo.':'A guardian must sign in again to enter the adult world.');
}
async function signOut(){
  const {error}=await db.auth.signOut({scope:'local'});
  if(error){showToast('No se pudo cerrar la sesión. Intenta de nuevo.');return;}
  state.user=null;state.supaSession=null;state.chatHistory=[];state.childProfiles=[];state.activeChildId=null;state.activeChildName=null;state.lessonProgress={};state.lessons=[];state.mode='adult';state.streak=0;
  document.body.classList.remove('kids-mode');navigate('login');
}
function setChatMode(){showToast('El mundo se determina por tu sesión.');}
function enterMode(){if(!state.user){navigate('login');return;}navigate('app');navigateApp('home');}

function showCheckoutQuote(quote){
  const target=new URL(quote.init_point);
  if(target.protocol!=='https:'||!(target.hostname==='mercadopago.com.mx'||target.hostname.endsWith('.mercadopago.com.mx')))throw Error('Destino de pago no válido.');
  document.getElementById('checkout-quote')?.remove();const box=document.createElement('div');box.id='checkout-quote';box.style.cssText='position:fixed;inset:0;z-index:5000;background:#171410ef;display:grid;place-items:center;padding:24px';
  const card=document.createElement('section');card.className='auth-card';
  const h=document.createElement('h2');h.textContent=state.lang==='es'?'Confirma el importe':'Confirm the amount';
  const p=document.createElement('p');p.textContent=`Referencia: ${Number(quote.reference_usd).toFixed(2)} USD. Cobro: ${Number(quote.amount_mxn).toFixed(2)} MXN. Tipo de cambio de referencia: ${Number(quote.fx_rate).toFixed(4)} MXN/USD (${quote.fx_date}). Tu banco puede aplicar su propia conversión o comisiones.`;
  const link=document.createElement('a');link.className='btn btn-gold';link.href=target.href;link.textContent='Continuar a Mercado Pago';
  const cancel=document.createElement('button');cancel.className='btn btn-ghost';cancel.textContent='Cancelar';cancel.onclick=()=>box.remove();card.append(h,p,link,cancel);box.append(card);document.body.append(box);
}
function showReport(){
  const text=prompt(state.lang==='es'?'Describe el problema. No incluyas contraseñas ni datos de tarjetas.':'Describe the issue. Do not include passwords or card details.');
  if(!text)return;api('/contact',{msg:text,type:'report',lang:state.lang}).then(()=>showToast('Reporte recibido. Gracias.')).catch(e=>showToast(e.message));
}

initSupabase().catch(()=>{buildApp();navigate('login');showToast('No se pudo cargar tu sesión. Intenta de nuevo.');});
