<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFather — Faith Education Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
/* ═══════════════════════════════════════════
   MYFATHER — Design System
   Aesthetic: Sacred luxury — dark vellum, 
   gold leaf, ancient manuscript meets modern
   ═══════════════════════════════════════════ */

:root {
  --ink:       #1a1410;
  --parchment: #f5f0e8;
  --vellum:    #ede7d5;
  --gold:      #c9973a;
  --gold-lt:   #e8c97a;
  --gold-dk:   #8a6420;
  --crimson:   #8b1a1a;
  --azure:     #1a4a8b;
  --sage:      #3d6b4f;
  --pearl:     #faf8f3;
  --shadow:    rgba(26,20,16,0.18);

  /* Kids palette */
  --kids-sky:    #6bbde3;
  --kids-sun:    #ffd166;
  --kids-grass:  #78c87a;
  --kids-cloud:  #f0f4ff;
  --kids-warm:   #ff8c69;

  --font-display: 'Cinzel', serif;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', sans-serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;

  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--parchment);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dk); border-radius: 3px; }

/* ══════════════════════════════════
   LAYOUT
══════════════════════════════════ */
#app { min-height: 100vh; }

.page { display: none; min-height: 100vh; }
.page.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════
   COMPONENTS — Buttons
══════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 12px 28px; border-radius: 40px;
  border: none; cursor: pointer;
  transition: var(--transition); text-decoration: none;
  letter-spacing: 0.03em;
}
.btn-gold {
  background: var(--gold);
  color: var(--ink);
}
.btn-gold:hover { background: var(--gold-lt); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,151,58,0.35); }

.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}
.btn-outline:hover { background: rgba(201,151,58,0.1); }

.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,0.12);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }

.btn-danger {
  background: var(--crimson); color: white;
}
.btn-sm { padding: 8px 18px; font-size: 13px; }
.btn-lg { padding: 16px 40px; font-size: 16px; }

/* ══════════════════════════════════
   COMPONENTS — Cards
══════════════════════════════════ */
.card {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(201,151,58,0.45);
  background: rgba(245,240,232,0.08);
}
.card-gold {
  background: linear-gradient(135deg, rgba(201,151,58,0.15), rgba(138,100,32,0.08));
  border-color: rgba(201,151,58,0.4);
}

/* ══════════════════════════════════
   COMPONENTS — Badge
══════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase;
}
.badge-gold { background: rgba(201,151,58,0.2); color: var(--gold-lt); border: 1px solid rgba(201,151,58,0.3); }
.badge-green { background: rgba(61,107,79,0.3); color: #7ecfa0; border: 1px solid rgba(61,107,79,0.4); }
.badge-red { background: rgba(139,26,26,0.3); color: #f08080; border: 1px solid rgba(139,26,26,0.4); }
.badge-blue { background: rgba(26,74,139,0.3); color: #7ab0f0; border: 1px solid rgba(26,74,139,0.4); }
.badge-kids { background: rgba(107,189,227,0.2); color: var(--kids-sky); border: 1px solid rgba(107,189,227,0.35); }

/* ══════════════════════════════════
   COMPONENTS — Inputs
══════════════════════════════════ */
.input-wrap { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 12px; color: rgba(245,240,232,0.5); letter-spacing: 0.04em; text-transform: uppercase; }

.input, .textarea, .select {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-sm);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 15px;
  padding: 12px 16px;
  transition: var(--transition);
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,240,232,0.09);
  box-shadow: 0 0 0 3px rgba(201,151,58,0.12);
}
.textarea { resize: vertical; min-height: 100px; }
.select { appearance: none; cursor: pointer; }

/* ══════════════════════════════════
   COMPONENTS — Navigation
══════════════════════════════════ */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid rgba(201,151,58,0.15);
  position: sticky; top: 0; z-index: 100;
  background: rgba(26,20,16,0.92);
  backdrop-filter: blur(20px);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px; color: var(--gold);
  letter-spacing: 0.1em; cursor: pointer;
  text-decoration: none;
}
.nav-logo span { color: var(--parchment); opacity: 0.5; font-size: 12px; display: block; letter-spacing: 0.2em; font-family: var(--font-body); font-weight: 300; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link {
  font-size: 13px; color: rgba(245,240,232,0.6);
  padding: 8px 14px; border-radius: 20px;
  cursor: pointer; transition: var(--transition);
  text-decoration: none; border: none; background: none; font-family: var(--font-body);
}
.nav-link:hover { color: var(--gold); background: rgba(201,151,58,0.08); }
.nav-link.active { color: var(--gold); }

/* ══════════════════════════════════
   LANDING PAGE
══════════════════════════════════ */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 80px 40px;
  position: relative; overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(201,151,58,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139,26,26,0.08) 0%, transparent 60%);
}

.hero-cross {
  width: 48px; height: 48px;
  margin: 0 auto 32px;
  opacity: 0.7;
}

.hero-eyebrow {
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1.05; color: var(--parchment);
  margin-bottom: 12px;
}
.hero-title em { color: var(--gold); font-style: italic; font-family: var(--font-serif); }

.hero-sub {
  font-family: var(--font-serif);
  font-size: clamp(18px, 2.5vw, 24px);
  color: rgba(245,240,232,0.55);
  font-style: italic; margin-bottom: 48px;
  max-width: 520px;
}

.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.hero-modes {
  display: flex; gap: 20px; margin-top: 64px;
  justify-content: center; flex-wrap: wrap;
}
.mode-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl);
  padding: 32px 28px; width: 240px; cursor: pointer;
  transition: var(--transition); text-align: center;
}
.mode-card:hover {
  transform: translateY(-4px);
  border-color: rgba(201,151,58,0.5);
  background: rgba(201,151,58,0.08);
  box-shadow: 0 20px 40px rgba(201,151,58,0.12);
}
.mode-card.kids { border-color: rgba(107,189,227,0.3); }
.mode-card.kids:hover { border-color: var(--kids-sky); background: rgba(107,189,227,0.08); }
.mode-emoji { font-size: 40px; margin-bottom: 14px; }
.mode-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.mode-card.kids .mode-title { color: var(--kids-sky); }
.mode-desc { font-size: 13px; color: rgba(245,240,232,0.5); line-height: 1.6; }

/* ══════════════════════════════════
   DASHBOARD
══════════════════════════════════ */
.dashboard { flex: 1; display: flex; }
.sidebar {
  width: 260px; min-height: calc(100vh - 73px);
  border-right: 1px solid rgba(201,151,58,0.12);
  padding: 28px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-section {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); padding: 16px 12px 6px; font-weight: 500;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition);
  font-size: 14px; color: rgba(245,240,232,0.6);
  border: none; background: none; font-family: var(--font-body);
  width: 100%; text-align: left;
}
.sidebar-item svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
.sidebar-item:hover { background: rgba(201,151,58,0.08); color: var(--gold); }
.sidebar-item:hover svg { opacity: 1; }
.sidebar-item.active { background: rgba(201,151,58,0.12); color: var(--gold); font-weight: 500; }
.sidebar-item.active svg { opacity: 1; }
.sidebar-badge { margin-left: auto; font-size: 10px; background: var(--crimson); color: white; padding: 2px 6px; border-radius: 10px; }

.main-content { flex: 1; padding: 36px 40px; overflow-y: auto; }
.page-header { margin-bottom: 32px; }
.page-header h1 { font-family: var(--font-serif); font-size: 32px; font-weight: 300; color: var(--parchment); margin-bottom: 4px; }
.page-header p { font-size: 14px; color: rgba(245,240,232,0.45); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: rgba(245,240,232,0.04); border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-md); padding: 20px;
}
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,240,232,0.4); margin-bottom: 8px; }
.stat-value { font-family: var(--font-serif); font-size: 36px; color: var(--gold); line-height: 1; }
.stat-sub { font-size: 12px; color: rgba(245,240,232,0.4); margin-top: 4px; }

/* ══════════════════════════════════
   AI CHAT
══════════════════════════════════ */
.chat-container {
  display: flex; flex-direction: column;
  height: calc(100vh - 160px); max-width: 760px; margin: 0 auto;
}
.chat-mode-bar {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.mode-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(245,240,232,0.15);
  background: transparent; cursor: pointer;
  font-size: 13px; color: rgba(245,240,232,0.5);
  font-family: var(--font-body); transition: var(--transition);
}
.mode-pill.active {
  border-color: var(--gold); color: var(--gold);
  background: rgba(201,151,58,0.1);
}
.mode-pill.kids-mode.active {
  border-color: var(--kids-sky); color: var(--kids-sky);
  background: rgba(107,189,227,0.1);
}

.chat-messages {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 4px 2px; padding-bottom: 20px;
}
.message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
.message.user { flex-direction: row-reverse; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  border: 1px solid rgba(201,151,58,0.3);
  background: rgba(201,151,58,0.1);
}
.msg-bubble {
  max-width: 75%; padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 15px; line-height: 1.65;
}
.message.ai .msg-bubble {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.1);
  color: var(--parchment);
  border-top-left-radius: 4px;
}
.message.user .msg-bubble {
  background: rgba(201,151,58,0.18);
  border: 1px solid rgba(201,151,58,0.25);
  color: var(--parchment);
  border-top-right-radius: 4px;
}
.msg-verse {
  margin-top: 10px; padding: 10px 14px;
  background: rgba(201,151,58,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: var(--font-serif); font-style: italic;
  font-size: 14px; color: rgba(245,240,232,0.7);
}
.msg-ref { font-size: 11px; color: var(--gold); opacity: 0.7; margin-top: 4px; font-style: normal; font-family: var(--font-body); }

/* Crisis / Safety alert in chat */
.msg-crisis {
  background: rgba(139,26,26,0.15);
  border: 1px solid rgba(139,26,26,0.4);
  border-radius: var(--radius-md); padding: 14px 16px; margin-top: 10px;
}
.msg-crisis-title { font-size: 13px; font-weight: 500; color: #f08080; margin-bottom: 8px; }
.msg-crisis-line { font-size: 13px; color: rgba(245,240,232,0.7); margin-bottom: 4px; }

.chat-input-area {
  padding: 16px 0 0;
  border-top: 1px solid rgba(245,240,232,0.08);
}
.chat-input-row {
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input-wrap { flex: 1; position: relative; }
.chat-input {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-xl);
  color: var(--parchment); font-family: var(--font-body); font-size: 15px;
  padding: 14px 48px 14px 20px;
  width: 100%; resize: none; max-height: 140px;
  transition: var(--transition);
}
.chat-input:focus { outline: none; border-color: var(--gold); background: rgba(245,240,232,0.09); }
.chat-send {
  position: absolute; right: 10px; bottom: 10px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); color: var(--ink);
}
.chat-send:hover { background: var(--gold-lt); transform: scale(1.05); }
.chat-disclaimer { font-size: 11px; color: rgba(245,240,232,0.25); text-align: center; margin-top: 8px; }

/* ══════════════════════════════════
   LESSONS
══════════════════════════════════ */
.lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.lesson-card {
  border-radius: var(--radius-lg); overflow: hidden;
  cursor: pointer; transition: var(--transition);
  border: 1px solid rgba(201,151,58,0.15);
  background: rgba(245,240,232,0.03);
}
.lesson-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,0.4); border-color: rgba(201,151,58,0.4); }
.lesson-thumb {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; position: relative; overflow: hidden;
}
.lesson-thumb::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(201,151,58,0.2), rgba(26,20,16,0.4));
}
.lesson-body { padding: 18px; }
.lesson-title { font-family: var(--font-serif); font-size: 18px; margin-bottom: 6px; }
.lesson-meta { font-size: 12px; color: rgba(245,240,232,0.4); display: flex; gap: 12px; }
.lesson-progress { height: 3px; background: rgba(245,240,232,0.1); border-radius: 2px; margin-top: 14px; }
.lesson-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }

/* Kids lesson cards */
.lesson-card.kids-card { border-color: rgba(107,189,227,0.2); }
.lesson-card.kids-card:hover { border-color: var(--kids-sky); box-shadow: 0 16px 36px rgba(107,189,227,0.12); }

/* ══════════════════════════════════
   DEVOTIONAL
══════════════════════════════════ */
.devotional-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl); padding: 48px;
  text-align: center;
}
.devotional-date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px; }
.devotional-verse {
  font-family: var(--font-serif); font-size: 26px;
  font-style: italic; line-height: 1.5;
  color: var(--parchment); margin-bottom: 12px;
}
.devotional-ref { font-size: 13px; color: var(--gold); margin-bottom: 32px; }
.devotional-body {
  font-size: 16px; line-height: 1.8;
  color: rgba(245,240,232,0.7); text-align: left;
}
.devotional-reflection {
  margin-top: 28px; padding: 20px 24px;
  background: rgba(201,151,58,0.07);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--gold);
  font-size: 15px; color: rgba(245,240,232,0.65); line-height: 1.7;
  text-align: left;
}
.devotional-actions { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }

/* ══════════════════════════════════
   READING PLAN
══════════════════════════════════ */
.reading-plan { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
.plan-calendar { }
.plan-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.plan-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: var(--transition); border: 1px solid rgba(245,240,232,0.08);
  flex-direction: column; gap: 2px;
}
.plan-day.done { background: rgba(61,107,79,0.3); border-color: rgba(61,107,79,0.5); color: #7ecfa0; }
.plan-day.today { background: rgba(201,151,58,0.2); border-color: var(--gold); color: var(--gold); }
.plan-day.upcoming { color: rgba(245,240,232,0.3); }
.plan-day .day-num { font-size: 14px; }
.plan-day .day-check { font-size: 10px; }

.reading-content { }
.book-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.book-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid rgba(245,240,232,0.15); background: transparent;
  color: rgba(245,240,232,0.5); cursor: pointer; transition: var(--transition);
  font-family: var(--font-body);
}
.book-btn:hover, .book-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,151,58,0.1); }

.passage-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-lg); padding: 32px;
}
.passage-text {
  font-family: var(--font-serif); font-size: 17px; line-height: 1.9;
  color: rgba(245,240,232,0.82);
}
.verse-num { font-size: 11px; color: var(--gold); vertical-align: super; margin-right: 3px; font-family: var(--font-body); }

/* ══════════════════════════════════
   QUIZ / GAMES
══════════════════════════════════ */
.quiz-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl); padding: 40px;
}
.quiz-progress-bar { height: 4px; background: rgba(245,240,232,0.1); border-radius: 2px; margin-bottom: 32px; }
.quiz-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }
.quiz-q { font-family: var(--font-serif); font-size: 22px; line-height: 1.5; margin-bottom: 28px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-radius: var(--radius-md);

function navigate(page){
  if(page==='app' && !state.user){ navigate('login'); return; }
  state.page=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  window.scrollTo(0,0);
}

function setupChatEvents(){

let chatBusy=false;
const SUICIDE_KW=['suicid','matarme','quitarme la vida','no quiero vivir','kill myself','end my life','dont want to live','hurt myself','hacerme daño','quiero morir'];
const ABUSE_KW=['me golpea','me pega','me toca','me hace daño','me abusa','abuse','hitting me','touching me','hurts me','me viola','rape','violated','molest','robé','robamos','ilegal','illegal'];
function detectCrisis(txt){
  const l=txt.toLowerCase();
  if(SUICIDE_KW.some(k=>l.includes(k))) return 'suicide';
  if(ABUSE_KW.some(k=>l.includes(k)))   return 'abuse';
  return null;
}

async function sendChat(){
  if(chatBusy) return;
  const inp=document.getElementById('chat-inp');
  const txt=inp.value.trim(); if(!txt) return;
  inp.value='';
  const msgs=document.getElementById('chat-msgs');
  if(!msgs) return;
  const isK=state.mode==='kids';
  msgs.innerHTML+=`<div class="message user"><div class="msg-avatar">👤</div><div><div class="msg-bubble">${esc(txt)}</div></div></div>`;
  const cr=detectCrisis(txt);
  if(cr==='suicide'){msgs.innerHTML+=crisisMsg();msgs.scrollTop=msgs.scrollHeight;return;}
  if(cr==='abuse')  {msgs.innerHTML+=abuseMsg(); msgs.scrollTop=msgs.scrollHeight;return;}
  const lid='l'+Date.now();
  msgs.innerHTML+=`<div class="message ai" id="${lid}"><div class="msg-avatar">✝️</div><div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div></div>`;
  msgs.scrollTop=msgs.scrollHeight; chatBusy=true;
  const lng=state.lang==='en'?'English':'Spanish (español)';
  const sys=isK
    ?`You are a friendly biblical assistant for children ages 4-12. Always respond in ${lng}. Speak simply and warmly, use occasional emojis. NEVER share violent, sexual or inappropriate content. If a child mentions abuse or danger, tell them calmly to talk to a trusted adult. Keep responses short (max 3 paragraphs).`
    :`You are a wise and compassionate Christian biblical tutor. Always respond in ${lng}. You have deep knowledge of theology, biblical history, and Christian tradition. Cite Bible verses when relevant with exact references (Book Chapter:Verse). If the user mentions suicidal thoughts, respond with love and compassion and include crisis help immediately. If they mention abuse or illegal situations, accompany them carefully. Keep responses under 250 words. You are the MyFather AI Tutor.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:[...state.chatHistory.slice(-6),{role:'user',content:txt}]})});
    const d=await r.json();
    const reply=d.content?.[0]?.text||'...';
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:reply});
    document.getElementById(lid)?.remove();
    // Extract verse quote if present
    const vm=reply.match(/["""]([^"""]{10,})["""]\s*[—–-]\s*(\S[^\n]{0,50})/);
    let main=esc(reply),vhtml='';
    if(vm){vhtml=`<div class="msg-verse">${esc(vm[1])}<div class="msg-ref">— ${esc(vm[2])}</div></div>`;main=esc(reply.replace(vm[0],'')).trim();}
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${main}${vhtml}</div></div></div>`;
  }catch{
    document.getElementById(lid)?.remove();
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble" style="color:rgba(245,240,232,0.5)">${t('chatError')}</div></div></div>`;
  }
  chatBusy=false; msgs.scrollTop=msgs.scrollHeight;
}
function crisisMsg(){return `<div class="message ai"><div class="msg-avatar">🕊️</div><div><div class="msg-bubble">${t('chatCrisisMsg')}<div class="msg-crisis"><div class="msg-crisis-title">${t('chatCrisisLines')}</div>${crisisLines.slice(0,4).map(l=>`<div class="msg-crisis-line">${l.country}: <strong>${l.number}</strong> (${l.name})</div>`).join('')}<div style="margin-top:10px"><button class="btn btn-danger btn-sm" onclick="showCrisis()">${t('chatSeeAll')}</button></div></div>${t('chatCrisisEnd')}</div></div></div>`;}

function buildQuiz(){state.quizState={q:0,score:0,answered:false};return renderQuizQ();}
function renderQuizQ(){
  const qs=QUIZ[state.lang]||QUIZ.es;
  if(state.quizState.q>=qs.length) return renderQuizEnd();
  const q=qs[state.quizState.q];
  return `<div class="page-header"><h1>${t('quizTitle')}</h1><p>${t('quizSub')}</p></div>
<div class="quiz-streak">${ic('star')} ${t('quizStreakLabel')} ${state.streak} · ${t('quizScoreLabel')} ${state.quizState.score}/${state.quizState.q}</div>
<div class="quiz-card">
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(state.quizState.q/qs.length)*100}%"></div></div>
  <div style="font-size:12px;color:rgba(245,240,232,0.35);margin-bottom:20px">${t('quizQuestion')} ${state.quizState.q+1} ${t('quizOf')} ${qs.length}</div>
  <div class="quiz-q">${q.q}</div>
  <div class="quiz-options" id="qopts">
    ${q.opts.map((o,i)=>`<div class="quiz-option" id="qo${i}" onclick="answerQuiz(${i})"><div class="quiz-letter">${'ABCD'[i]}</div><span>${o}</span></div>`).join('')}
  </div>
  <div id="qfb" style="margin-top:20px;display:none"></div>
</div>`;
}
function answerQuiz(idx){
  if(state.quizState.answered) return;
  state.quizState.answered=true;
  const qs=QUIZ[state.lang]||QUIZ.es;
  const q=qs[state.quizState.q];
  document.getElementById(`qo${q.correct}`)?.classList.add('correct');
  if(idx!==q.correct) document.getElementById(`qo${idx}`)?.classList.add('wrong');
  else state.quizState.score++;
  const fb=document.getElementById('qfb'); if(!fb) return;
  fb.style.display='block';
  fb.innerHTML=`<div style="font-size:14px;color:rgba(245,240,232,0.6);margin-bottom:12px">${idx===q.correct?t('quizCorrect'):`${t('quizWrong')} <strong style="color:#7ecfa0">${q.opts[q.correct]}</strong>`}</div>
  <div style="font-family:var(--font-serif);font-style:italic;font-size:14px;color:rgba(245,240,232,0.5);margin-bottom:14px">${t('quizRef')} ${q.verse}</div>
  <button class="btn btn-gold btn-sm" onclick="nextQuizQ()">${state.quizState.q+1<qs.length?t('quizNext'):t('quizFinish')}</button>`;
}
function nextQuizQ(){state.quizState.q++;state.quizState.answered=false;document.getElementById('main-content').innerHTML=renderQuizQ();}
function renderQuizEnd(){
  const total=(QUIZ[state.lang]||QUIZ.es).length;
  const pct=Math.round((state.quizState.score/total)*100);
  return `<div class="page-header"><h1>${t('quizCompleteTitle')}</h1></div>
<div class="quiz-card" style="text-align:center">
  <div style="font-size:64px;margin-bottom:20px">${pct>=80?'🏆':pct>=60?'⭐':'📖'}</div>
  <div style="font-family:var(--font-serif);font-size:36px;color:var(--gold);margin-bottom:8px">${state.quizState.score}/${total}</div>
  <div style="font-size:18px;margin-bottom:24px">${pct}% ${state.lang==='en'?'correct':'correcto'}</div>
  <div style="font-size:15px;color:rgba(245,240,232,0.5);line-height:1.7;margin-bottom:28px">${pct>=80?t('quizCompleteSub1'):t('quizCompleteSub2')}</div>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-gold" onclick="navigateApp('quiz')">${t('quizRetry')}</button>
    <button class="btn btn-outline" onclick="navigateApp('chat')">${t('quizAsk')}</button>
  </div>
</div>`;
}

// CRISIS MODAL
// ══════════════════════════════════
function buildCrisisModal(){
  return `<div class="crisis-modal" id="crisis-modal">
<div class="crisis-box">
  <div style="font-size:32px;margin-bottom:12px">🕊️</div>
  <div class="crisis-title" id="cm-t">${t('crisisTitle')}</div>
  <div class="crisis-sub" id="cm-s">${t('crisisSub')}</div>
  <div class="crisis-lines">${crisisLines.map(l=>`<div class="crisis-line-item"><div><div class="crisis-country">${l.country}</div><div style="font-size:11px;color:rgba(245,240,232,0.3)">${l.name}</div></div><div class="crisis-number">${l.number}</div></div>`).join('')}</div>
  <div class="crisis-also" id="cm-a">${t('crisisAlso')}</div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-danger" id="cm-call">${t('crisisCall')}</button>
    <button class="btn btn-ghost" onclick="hideCrisis()" id="cm-close">${t('crisisClose')}</button>
  </div>
</div></div>`;
}
function buildToastEl(){return `<div class="toast" id="toast"></div>`;}

// ══════════════════════════════════
// AUTH HANDLERS
// ══════════════════════════════════
function handleAuth(type){
  const email=document.getElementById(`ae-${type}`)?.value.trim();
  const pass =document.getElementById(`ap-${type}`)?.value.trim();
  const err  =document.getElementById(`ae-err-${type}`);
  if(!email||!pass||pass.length<6){if(err){err.style.display='block';err.textContent=t('authLoginError');} return;}
  if(type==='login'){
    state.user={name:email.split('@')[0].charAt(0).toUpperCase()+email.split('@')[0].slice(1),email};
    navigate('app'); navigateApp('home');
  }else{
    const name=document.getElementById('an-inp')?.value.trim();
    if(!name){if(err){err.style.display='block';err.textContent=t('authLoginError');} return;}
    state.user={name,email};
    showToast(t('authSignupSuccess'));
    navigate('app'); navigateApp('home');
  }
}
function signOut(){state.user=null;state.chatHistory=[];navigate('landing');}
function enterMode(m){state.mode=m;document.body.classList.toggle('kids-mode',m==='kids');if(!state.user){navigate('login');}else{navigate('app');navigateApp('home');}}

// ══════════════════════════════════
// TOGGLES
// ══════════════════════════════════
function toggleMode(){
  state.mode=state.mode==='adult'?'kids':'adult';
  document.body.classList.toggle('kids-mode',state.mode==='kids');
  const mb=document.getElementById('app-mode'); if(mb) mb.textContent=state.mode==='kids'?t('switchToAdult'):t('switchToKids');
  const ml=document.getElementById('app-tag'); if(ml) ml.textContent=state.mode==='kids'?(state.lang==='en'?'KIDS MODE ⭐':'MODO NIÑOS ⭐'):t('appTagline');
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=buildSidebar();
  navigateApp('home');
}

function toggleLang(){
  state.lang=state.lang==='es'?'en':'es';
  rebuildUI();
}

function rebuildUI(){
  const isEN=state.lang==='en';
  const langLabel=isEN?'🌐 ES':'🌐 EN';
  document.querySelectorAll('#l-lang,#app-lang,#pp-lang').forEach(b=>{if(b)b.textContent=langLabel;});
  // Landing
  const set=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  set('l-tag','appTagline'); set('l-pnav','pricing'); set('l-si','signIn'); set('l-su','signUp');
  set('l-eyebrow','heroEyebrow'); set('l-ht','heroTitle'); // can't set with child; do:
  const lht=document.getElementById('l-ht'); if(lht) lht.innerHTML=`${t('heroTitle')}<em id="l-hti">${t('heroTitleItalic')}</em>`;
  set('l-hsub','heroSub'); set('l-ba','enterAdult'); set('l-bk','enterKids');
  set('l-am','adultMode'); set('l-ad','adultDesc'); set('l-km','kidsMode'); set('l-kd','kidsDesc');
  set('l-s1','marketUsers'); set('l-s2','marketBooks'); set('l-s3','marketQuestions');
  for(let i=1;i<=6;i++){set(`l-ft${i}`,`featTitle${i}`);set(`l-fd${i}`,`featDesc${i}`);}
  set('l-footer','footer');
  // pricing strip on landing
  set('l-ptitle','pricingTitle'); set('l-psub','pricingSub');
  const lpc=document.getElementById('l-pcards'); if(lpc) lpc.innerHTML=renderPricingCards(getPricingPlans(),true);
  // auth
  const setAuth=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=t(key);};
  ['login','signup'].forEach(type=>{
    setAuth(`at-tag-${type}`,type==='login'?'authLoginTagline':'authSignupTagline');
    setAuth(`al-email-${type}`,'authEmail'); setAuth(`al-pass-${type}`,'authPass');
    setAuth(`ab-${type}`,type==='login'?'authLoginBtn':'authSignupBtn');
    setAuth(`as-${type}`,type==='login'?'authGoSignup':'authGoLogin');
    setAuth(`ab2-${type}`,'authBack'); setAuth(`al-hint-${type}`,'authHint');
  });
  setAuth('al-name','authName'); setAuth('al-type','authAccountType');
  const at=document.getElementById('atype');
  if(at){at.options[0].text=t('authTypeAdult');at.options[1].text=t('authTypeKids');at.options[2].text=t('authTypeFamily');at.options[3].text=t('authTypeChurch');}
  // app nav
  setAuth('app-tag','appTagline'); setAuth('app-mode',state.mode==='kids'?'switchToAdult':'switchToKids');
  setAuth('app-crisis','emergencyBtn'); setAuth('app-so','signOut');
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=buildSidebar();
  // pricing page
  setAuth('pp-title','pricingTitle'); setAuth('pp-sub','pricingSub');
  const ppc=document.getElementById('pp-cards'); if(ppc) ppc.innerHTML=renderPricingCards(getPricingPlans(),false);
  // crisis modal
  setAuth('cm-t','crisisTitle'); setAuth('cm-s','crisisSub'); setAuth('cm-a','crisisAlso');
  setAuth('cm-call','crisisCall'); setAuth('cm-close','crisisClose');
  // re-render current app page
  if(state.page==='app') navigateApp(_currentPage);
}

// ══════════════════════════════════
// CHECKOUT
// ══════════════════════════════════
function handleCheckout(plan){
  if(!state.user&&plan!=='free'){navigate('signup');return;}
  showToast(t('toastCheckout'));
}

// ══════════════════════════════════
// UI UTILS
// ══════════════════════════════════
function showCrisis(){document.getElementById('crisis-modal')?.classList.add('show');}
function hideCrisis(){document.getElementById('crisis-modal')?.classList.remove('show');}
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function attachGlobalEvents(){
  document.getElementById('crisis-modal')?.addEventListener('click',function(e){if(e.target===this)hideCrisis();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCrisis();});
}
