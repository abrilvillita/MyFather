<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFather — Faith Education Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
/* ═══════════════════════════════════════════
   MYFATHER — Design System
   Aesthetic: Sacred luxury — dark vellum, 
   gold leaf, ancient manuscript meets modern
   ═══════════════════════════════════════════ */

:root {
  --ink:       #1a1410;
  --parchment: #f5f0e8;
  --vellum:    #ede7d5;
  --gold:      #c9973a;
  --gold-lt:   #e8c97a;
  --gold-dk:   #8a6420;
  --crimson:   #8b1a1a;
  --azure:     #1a4a8b;
  --sage:      #3d6b4f;
  --pearl:     #faf8f3;
  --shadow:    rgba(26,20,16,0.18);

  /* Kids palette */
  --kids-sky:    #6bbde3;
  --kids-sun:    #ffd166;
  --kids-grass:  #78c87a;
  --kids-cloud:  #f0f4ff;
  --kids-warm:   #ff8c69;

  --font-display: 'Cinzel', serif;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', sans-serif;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;

  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--parchment);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dk); border-radius: 3px; }

/* ══════════════════════════════════
   LAYOUT
══════════════════════════════════ */
#app { min-height: 100vh; }

.page { display: none; min-height: 100vh; }
.page.active { display: flex; flex-direction: column; }

/* ══════════════════════════════════
   COMPONENTS — Buttons
══════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 12px 28px; border-radius: 40px;
  border: none; cursor: pointer;
  transition: var(--transition); text-decoration: none;
  letter-spacing: 0.03em;
}
.btn-gold {
  background: var(--gold);
  color: var(--ink);
}
.btn-gold:hover { background: var(--gold-lt); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(201,151,58,0.35); }

.btn-outline {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
}
.btn-outline:hover { background: rgba(201,151,58,0.1); }

.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--parchment);
  border: 1px solid rgba(255,255,255,0.12);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }

.btn-danger {
  background: var(--crimson); color: white;
}
.btn-sm { padding: 8px 18px; font-size: 13px; }
.btn-lg { padding: 16px 40px; font-size: 16px; }

/* ══════════════════════════════════
   COMPONENTS — Cards
══════════════════════════════════ */
.card {
  background: rgba(245,240,232,0.05);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-lg);
  padding: 24px;
  transition: var(--transition);
}
.card:hover {
  border-color: rgba(201,151,58,0.45);
  background: rgba(245,240,232,0.08);
}
.card-gold {
  background: linear-gradient(135deg, rgba(201,151,58,0.15), rgba(138,100,32,0.08));
  border-color: rgba(201,151,58,0.4);
}

/* ══════════════════════════════════
   COMPONENTS — Badge
══════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase;
}
.badge-gold { background: rgba(201,151,58,0.2); color: var(--gold-lt); border: 1px solid rgba(201,151,58,0.3); }
.badge-green { background: rgba(61,107,79,0.3); color: #7ecfa0; border: 1px solid rgba(61,107,79,0.4); }
.badge-red { background: rgba(139,26,26,0.3); color: #f08080; border: 1px solid rgba(139,26,26,0.4); }
.badge-blue { background: rgba(26,74,139,0.3); color: #7ab0f0; border: 1px solid rgba(26,74,139,0.4); }
.badge-kids { background: rgba(107,189,227,0.2); color: var(--kids-sky); border: 1px solid rgba(107,189,227,0.35); }

/* ══════════════════════════════════
   COMPONENTS — Inputs
══════════════════════════════════ */
.input-wrap { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 12px; color: rgba(245,240,232,0.5); letter-spacing: 0.04em; text-transform: uppercase; }

.input, .textarea, .select {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-sm);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 15px;
  padding: 12px 16px;
  transition: var(--transition);
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(245,240,232,0.09);
  box-shadow: 0 0 0 3px rgba(201,151,58,0.12);
}
.textarea { resize: vertical; min-height: 100px; }
.select { appearance: none; cursor: pointer; }

/* ══════════════════════════════════
   COMPONENTS — Navigation
══════════════════════════════════ */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid rgba(201,151,58,0.15);
  position: sticky; top: 0; z-index: 100;
  background: rgba(26,20,16,0.92);
  backdrop-filter: blur(20px);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px; color: var(--gold);
  letter-spacing: 0.1em; cursor: pointer;
  text-decoration: none;
}
.nav-logo span { color: var(--parchment); opacity: 0.5; font-size: 12px; display: block; letter-spacing: 0.2em; font-family: var(--font-body); font-weight: 300; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-link {
  font-size: 13px; color: rgba(245,240,232,0.6);
  padding: 8px 14px; border-radius: 20px;
  cursor: pointer; transition: var(--transition);
  text-decoration: none; border: none; background: none; font-family: var(--font-body);
}
.nav-link:hover { color: var(--gold); background: rgba(201,151,58,0.08); }
.nav-link.active { color: var(--gold); }

/* ══════════════════════════════════
   LANDING PAGE
══════════════════════════════════ */
.hero {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 80px 40px;
  position: relative; overflow: hidden;
}

.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(201,151,58,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139,26,26,0.08) 0%, transparent 60%);
}

.hero-cross {
  width: 48px; height: 48px;
  margin: 0 auto 32px;
  opacity: 0.7;
}

.hero-eyebrow {
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.2em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 20px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1.05; color: var(--parchment);
  margin-bottom: 12px;
}
.hero-title em { color: var(--gold); font-style: italic; font-family: var(--font-serif); }

.hero-sub {
  font-family: var(--font-serif);
  font-size: clamp(18px, 2.5vw, 24px);
  color: rgba(245,240,232,0.55);
  font-style: italic; margin-bottom: 48px;
  max-width: 520px;
}

.hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

.hero-modes {
  display: flex; gap: 20px; margin-top: 64px;
  justify-content: center; flex-wrap: wrap;
}
.mode-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl);
  padding: 32px 28px; width: 240px; cursor: pointer;
  transition: var(--transition); text-align: center;
}
.mode-card:hover {
  transform: translateY(-4px);
  border-color: rgba(201,151,58,0.5);
  background: rgba(201,151,58,0.08);
  box-shadow: 0 20px 40px rgba(201,151,58,0.12);
}
.mode-card.kids { border-color: rgba(107,189,227,0.3); }
.mode-card.kids:hover { border-color: var(--kids-sky); background: rgba(107,189,227,0.08); }
.mode-emoji { font-size: 40px; margin-bottom: 14px; }
.mode-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); margin-bottom: 8px; }
.mode-card.kids .mode-title { color: var(--kids-sky); }
.mode-desc { font-size: 13px; color: rgba(245,240,232,0.5); line-height: 1.6; }

/* ══════════════════════════════════
   DASHBOARD
══════════════════════════════════ */
.dashboard { flex: 1; display: flex; }
.sidebar {
  width: 260px; min-height: calc(100vh - 73px);
  border-right: 1px solid rgba(201,151,58,0.12);
  padding: 28px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar-section {
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(245,240,232,0.3); padding: 16px 12px 6px; font-weight: 500;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition);
  font-size: 14px; color: rgba(245,240,232,0.6);
  border: none; background: none; font-family: var(--font-body);
  width: 100%; text-align: left;
}
.sidebar-item svg { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
.sidebar-item:hover { background: rgba(201,151,58,0.08); color: var(--gold); }
.sidebar-item:hover svg { opacity: 1; }
.sidebar-item.active { background: rgba(201,151,58,0.12); color: var(--gold); font-weight: 500; }
.sidebar-item.active svg { opacity: 1; }
.sidebar-badge { margin-left: auto; font-size: 10px; background: var(--crimson); color: white; padding: 2px 6px; border-radius: 10px; }

.main-content { flex: 1; padding: 36px 40px; overflow-y: auto; }
.page-header { margin-bottom: 32px; }
.page-header h1 { font-family: var(--font-serif); font-size: 32px; font-weight: 300; color: var(--parchment); margin-bottom: 4px; }
.page-header p { font-size: 14px; color: rgba(245,240,232,0.45); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: rgba(245,240,232,0.04); border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-md); padding: 20px;
}
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(245,240,232,0.4); margin-bottom: 8px; }
.stat-value { font-family: var(--font-serif); font-size: 36px; color: var(--gold); line-height: 1; }
.stat-sub { font-size: 12px; color: rgba(245,240,232,0.4); margin-top: 4px; }

/* ══════════════════════════════════
   AI CHAT
══════════════════════════════════ */
.chat-container {
  display: flex; flex-direction: column;
  height: calc(100vh - 160px); max-width: 760px; margin: 0 auto;
}
.chat-mode-bar {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.mode-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(245,240,232,0.15);
  background: transparent; cursor: pointer;
  font-size: 13px; color: rgba(245,240,232,0.5);
  font-family: var(--font-body); transition: var(--transition);
}
.mode-pill.active {
  border-color: var(--gold); color: var(--gold);
  background: rgba(201,151,58,0.1);
}
.mode-pill.kids-mode.active {
  border-color: var(--kids-sky); color: var(--kids-sky);
  background: rgba(107,189,227,0.1);
}

.chat-messages {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding: 4px 2px; padding-bottom: 20px;
}
.message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
.message.user { flex-direction: row-reverse; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bounceIn { 0%{transform:scale(0.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
@keyframes streakPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes kidsGlow { 0%,100%{box-shadow:0 0 0 0 rgba(107,189,227,0.3)} 50%{box-shadow:0 0 0 8px rgba(107,189,227,0)} }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  border: 1px solid rgba(201,151,58,0.3);
  background: rgba(201,151,58,0.1);
}
.msg-bubble {
  max-width: 75%; padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 15px; line-height: 1.65;
}
.message.ai .msg-bubble {
  background: rgba(245,240,232,0.06);
  border: 1px solid rgba(245,240,232,0.1);
  color: var(--parchment);
  border-top-left-radius: 4px;
}
.message.user .msg-bubble {
  background: rgba(201,151,58,0.18);
  border: 1px solid rgba(201,151,58,0.25);
  color: var(--parchment);
  border-top-right-radius: 4px;
}
.msg-verse {
  margin-top: 10px; padding: 10px 14px;
  background: rgba(201,151,58,0.08);
  border-left: 2px solid var(--gold);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: var(--font-serif); font-style: italic;
  font-size: 14px; color: rgba(245,240,232,0.7);
}
.msg-ref { font-size: 11px; color: var(--gold); opacity: 0.7; margin-top: 4px; font-style: normal; font-family: var(--font-body); }

/* Crisis / Safety alert in chat */
.msg-crisis {
  background: rgba(139,26,26,0.15);
  border: 1px solid rgba(139,26,26,0.4);
  border-radius: var(--radius-md); padding: 14px 16px; margin-top: 10px;
}
.msg-crisis-title { font-size: 13px; font-weight: 500; color: #f08080; margin-bottom: 8px; }
.msg-crisis-line { font-size: 13px; color: rgba(245,240,232,0.7); margin-bottom: 4px; }

.chat-input-area {
  padding: 16px 0 0;
  border-top: 1px solid rgba(245,240,232,0.08);
}
.chat-input-row {
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input-wrap { flex: 1; position: relative; }
.chat-input {
  background: rgba(245,240,232,0.07);
  border: 1px solid rgba(245,240,232,0.15);
  border-radius: var(--radius-xl);
  color: var(--parchment); font-family: var(--font-body); font-size: 15px;
  padding: 14px 48px 14px 20px;
  width: 100%; resize: none; max-height: 140px;
  transition: var(--transition);
}
.chat-input:focus { outline: none; border-color: var(--gold); background: rgba(245,240,232,0.09); }
.chat-send {
  position: absolute; right: 10px; bottom: 10px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); color: var(--ink);
}
.chat-send:hover { background: var(--gold-lt); transform: scale(1.05); }
.chat-disclaimer { font-size: 11px; color: rgba(245,240,232,0.25); text-align: center; margin-top: 8px; }

/* ══════════════════════════════════
   LESSONS
══════════════════════════════════ */
.lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.lesson-card {
  border-radius: var(--radius-lg); overflow: hidden;
  cursor: pointer; transition: var(--transition);
  border: 1px solid rgba(201,151,58,0.15);
  background: rgba(245,240,232,0.03);
}
.lesson-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0,0,0,0.4); border-color: rgba(201,151,58,0.4); }
.lesson-thumb {
  height: 140px;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px; position: relative; overflow: hidden;
}
.lesson-thumb::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(201,151,58,0.2), rgba(26,20,16,0.4));
}
.lesson-body { padding: 18px; }
.lesson-title { font-family: var(--font-serif); font-size: 18px; margin-bottom: 6px; }
.lesson-meta { font-size: 12px; color: rgba(245,240,232,0.4); display: flex; gap: 12px; }
.lesson-progress { height: 3px; background: rgba(245,240,232,0.1); border-radius: 2px; margin-top: 14px; }
.lesson-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }

/* Kids lesson cards */
.lesson-card.kids-card { border-color: rgba(107,189,227,0.2); }
.lesson-card.kids-card:hover { border-color: var(--kids-sky); box-shadow: 0 16px 36px rgba(107,189,227,0.12); }

/* ══════════════════════════════════
   DEVOTIONAL
══════════════════════════════════ */
.devotional-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);
  border-radius: var(--radius-xl); padding: 48px;
  text-align: center;
}
.devotional-date { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px; }
.devotional-verse {
  font-family: var(--font-serif); font-size: 26px;
  font-style: italic; line-height: 1.5;
  color: var(--parchment); margin-bottom: 12px;
}
.devotional-ref { font-size: 13px; color: var(--gold); margin-bottom: 32px; }
.devotional-body {
  font-size: 16px; line-height: 1.8;
  color: rgba(245,240,232,0.7); text-align: left;
}
.devotional-reflection {
  margin-top: 28px; padding: 20px 24px;
  background: rgba(201,151,58,0.07);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--gold);
  font-size: 15px; color: rgba(245,240,232,0.65); line-height: 1.7;
  text-align: left;
}
.devotional-actions { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }

/* ══════════════════════════════════
   READING PLAN
══════════════════════════════════ */
.reading-plan { display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
.plan-calendar { }
.plan-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.plan-day {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: var(--transition); border: 1px solid rgba(245,240,232,0.08);
  flex-direction: column; gap: 2px;
}
.plan-day.done { background: rgba(61,107,79,0.3); border-color: rgba(61,107,79,0.5); color: #7ecfa0; }
.plan-day.today { background: rgba(201,151,58,0.2); border-color: var(--gold); color: var(--gold); }
.plan-day.upcoming { color: rgba(245,240,232,0.3); }
.plan-day .day-num { font-size: 14px; }
.plan-day .day-check { font-size: 10px; }

.reading-content { }
.book-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.book-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid rgba(245,240,232,0.15); background: transparent;
  color: rgba(245,240,232,0.5); cursor: pointer; transition: var(--transition);
  font-family: var(--font-body);
}
.book-btn:hover, .book-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,151,58,0.1); }

.passage-card {
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.15);
  border-radius: var(--radius-lg); padding: 32px;
}
.passage-text {
  font-family: var(--font-serif); font-size: 17px; line-height: 1.9;
  color: rgba(245,240,232,0.82);
}
.verse-num { font-size: 11px; color: var(--gold); vertical-align: super; margin-right: 3px; font-family: var(--font-body); }

/* ══════════════════════════════════
   QUIZ / GAMES
══════════════════════════════════ */
.quiz-card {
  max-width: 640px; margin: 0 auto;
  background: rgba(245,240,232,0.04);
  border: 1px solid rgba(201,151,58,0.2);

// ═══════════════════════════════════════════════════════
// MYFATHER — Full App v2 + Supabase

// ── Supabase singleton (evita warning de múltiples instancias) ──
const SUPA_URL  = 'https://eumxuuvtixkojkjuzyyo.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bXh1dXZ0aXhrb2pranV6eXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDQ2NDksImV4cCI6MjA5MDAyMDY0OX0.srYdofHSEBQby4QKpBKeZ0BkSETl2H89UpupeUqYD7Q';

const db = window.__mfDb;

const state = {

  supaSession: null,
  mode:        'adult',
  lang:        'es',
  page:        'landing',
  streak:      0,
  chatHistory: [],
  chatSessionId: null,
  quizState:   { q: 0, score: 0, answered: false },
  msgThisMonth: 0,   // mensajes IA usados este mes
};

// ── Supabase Auth helpers ────────────────────────────
async function supaSignUp(email, pass, name, accountType){
  const { data, error } = await db.auth.signUp({
    email, password: pass,
    options: { data: { full_name: name, account_type: accountType, lang: state.lang } }
  });
  if(error) throw error;
  return data;
}

async function supaLogin(email, pass){
  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if(error) throw error;
  return data;
}

async function supaLogout(){
  await db.auth.signOut();
  state.user = null;
  state.supaSession = null;
  state.chatHistory = [];
  state.chatSessionId = null;
}

async function loadProfile(userId){
  const { data } = await db.from('profiles').select('*').eq('id', userId).single();
  return data;
}

// ── Límites de mensajes IA por plan ─────────────────
const PLAN_MSG_LIMITS = { free: 10, basic: 60, premium: 99999, family: 99999, church: 99999 };

function getMsgLimit(){ return PLAN_MSG_LIMITS[state.user?.plan||'free'] || 10; }
function canSendMsg(){
  if(!state.user) return false;
  return state.msgThisMonth < getMsgLimit();
}
function getMsgRemaining(){ return Math.max(0, getMsgLimit() - state.msgThisMonth); }

async function loadMsgCount(userId){
  // Contar mensajes del mes actual desde chat_sessions
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  try {
    const { count } = await db.from('chat_sessions')
      .select('*', { count:'exact', head:true })
      .eq('user_id', userId)
      .gte('created_at', start.toISOString());
    state.msgThisMonth = count || 0;
  } catch { state.msgThisMonth = 0; }
}
async function logCrisis(type, triggerText){
  try {
    await db.from('crisis_alerts').insert({
      user_id: state.user?.id || null,
      alert_type: type,
      trigger_text: triggerText?.substring(0,200),
      lang: state.lang,
      mode: state.mode
    });
  } catch(e){ console.warn('crisis log failed', e); }
}

// ── Quiz score saver ─────────────────────────────────
async function saveQuizScore(score, total){
  if(!state.user) return;
  try {
    await db.from('quiz_scores').insert({
      user_id: state.user.id,
      score, total,
      lang: state.lang,
      mode: state.mode
    });
  } catch(e){ console.warn('quiz save failed', e); }
}

// ── Chat session persistence ─────────────────────────
async function saveChatMessage(userMsg, aiReply){
  if(!state.user) return;
  try {
    if(!state.chatSessionId){
      const { data } = await db.from('chat_sessions').insert({
        user_id: state.user.id,
        mode: state.mode,
        lang: state.lang,
        messages: [{ role:'user', content:userMsg },{ role:'assistant', content:aiReply }]
      }).select('id').single();
      if(data) state.chatSessionId = data.id;
    } else {
      const msgs = [...state.chatHistory];
      await db.from('chat_sessions')
        .update({ messages: msgs, updated_at: new Date().toISOString() })
        .eq('id', state.chatSessionId);
    }
  } catch(e){ console.warn('chat save failed', e); }
}

// ── Haven session logger ─────────────────────────────
async function logHaven(feeling){
  if(!state.user) return;
  try {
    await db.from('haven_sessions').insert({
      user_id: state.user.id,
      feeling,
      lang: state.lang
    });
  } catch(e){ console.warn('haven log failed', e); }
}

// ── Init: restore session if exists ──────────────────
// ── Cache de contenido desde Supabase ────────────────
const contentCache = { verses:[], quiz:[], devotionals:[], readingPlan:[], lessons:[] };

async function loadContentFromDB(){
  try {
    // Versículo de hoy
    const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
    const { data: verses } = await db.from('daily_verses').select('*').eq('day_of_year', dayOfYear).single();
    if(verses) contentCache.verses = [verses];

    // Quiz questions
    const { data: quiz } = await db.from('quiz_questions').select('*').order('id').limit(50);
    if(quiz?.length) contentCache.quiz = quiz;

    // Devocional de esta semana
    const weekNum = Math.ceil(dayOfYear / 7);
    const { data: dev } = await db.from('devotionals').select('*').eq('week_num', weekNum).single();
    if(dev) contentCache.devotionals = [dev];

    // Plan de lectura del día
    const { data: reading } = await db.from('reading_plan').select('*').eq('day_num', dayOfYear).single();
    if(reading) contentCache.readingPlan = [reading];

  } catch(e){ console.warn('Content load error (usando fallback local):', e?.message); }
}

function getTodayVerseFromDB(){
  if(contentCache.verses?.length){
    const v = contentCache.verses[0];
    return state.lang==='en'
      ? { v: v.verse_en, r: v.ref_en }
      : { v: v.verse_es, r: v.ref_es };
  }
  return getTodayVerse(); // fallback local
}

function getTodayDevotionalFromDB(){
  if(contentCache.devotionals?.length){
    const d = contentCache.devotionals[0];
    return state.lang==='en'
      ? { verse: d.verse_en, ref: d.ref_en, body: d.body_en, reflection: d.reflection_en, title: d.title_en }
      : { verse: d.verse_es, ref: d.ref_es, body: d.body_es, reflection: d.reflection_es, title: d.title_es };
  }
  return DEVOTIONAL[state.lang]||DEVOTIONAL.es; // fallback
}

function getTodayReadingFromDB(){
  if(contentCache.readingPlan?.length){
    const r = contentCache.readingPlan[0];
    return state.lang==='en'
      ? { book: r.book_en, chapter: r.chapter, title: r.title_en, text: r.passage_en }
      : { book: r.book_es, chapter: r.chapter, title: r.title_es, text: r.passage_es };
  }
  return null;
}

async function initSupabase(){
  const { data: { session } } = await db.auth.getSession();
  if(session){
    state.supaSession = session;
    const profile = await loadProfile(session.user.id);
    if(profile){
      state.user = {
        id: session.user.id,
        email: session.user.email,
        name: profile.full_name,
        plan: profile.plan,
        streak: profile.streak,
        account_type: profile.account_type,
        coins: profile.coins || 0,
        total_lessons: profile.total_lessons || 0,
        total_verses: profile.total_verses || 0,
        quiz_avg: profile.quiz_avg || 0,
      };
      state.streak = profile.streak;
      state.lang   = profile.lang || 'es';
      await loadMsgCount(session.user.id);
    }
  }
  // Cargar contenido de Supabase en paralelo (no bloquea el inicio)
  loadContentFromDB().catch(()=>{});
  buildApp();
}

db.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT'){
    state.user = null;
    state.supaSession = null;
    navigate('landing');
  }
});

function navigate(page){
  if(page==='app' && !state.user){ navigate('login'); return; }
  state.page=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  window.scrollTo(0,0);
}

const MP_PUBLIC_KEY = ''; // Cargada desde el Worker

async function handleCheckout(plan){
  if(!state.user && plan!=='free'){ navigate('signup'); return; }
  if(plan==='free'){ showToast(state.lang==='es'?'¡Ya tienes acceso gratuito!':'You already have free access!'); return; }
  if(plan==='church'){ navigateApp('contact'); return; }

  if(CF_WORKER_URL){
    showToast(state.lang==='es'?'Conectando con MercadoPago...':'Connecting to MercadoPago...');
    try {
      const r = await fetch(`${CF_WORKER_URL}/mp/create-pref`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ plan, user_id: state.user.id, lang: state.lang })
      });
      const { init_point, sandbox_init_point } = await r.json();
      // En desarrollo usa sandbox, en producción usa init_point
      window.location.href = sandbox_init_point || init_point;
    } catch(e){
      showToast(state.lang==='es'?'Error conectando a MercadoPago':'MercadoPago connection error');
    }
  } else {
    // Mientras el Worker no esté configurado
    showToast(state.lang==='es'?'Pagos disponibles muy pronto en myfather.app':'Payments coming very soon to myfather.app');
  }
}

async function buyItem(itemId){
  if(!state.user){ navigate('login'); return; }
  const items = STORE_ITEMS[state.lang]||STORE_ITEMS.es;
  const item = items.find(i=>i.id===itemId);
  if(!item) return;

  if(CF_WORKER_URL){
    showToast(state.lang==='es'?`Procesando: ${item.name}...`:`Processing: ${item.name}...`);
    try {
      const r = await fetch(`${CF_WORKER_URL}/mp/store-checkout`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ item_id: itemId, user_id: state.user.id })
      });
      const { init_point } = await r.json();
      window.location.href = init_point;
    } catch(e){
      showToast(state.lang==='es'?'Error al procesar':'Processing error');
    }
  } else {
    showToast(state.lang==='es'?`Tienda disponible muy pronto — ${item.name}`:`Store coming soon — ${item.name}`);
  }
}

function renderPricingCards(plans, compact){
  const cols = compact ? 'repeat(auto-fit,minmax(185px,1fr))' : 'repeat(auto-fit,minmax(210px,1fr))';
  return `<div style="display:grid;grid-template-columns:${cols};gap:16px">
  ${plans.map(p=>`<div class="pricing-card ${p.featured?'featured':''}" style="${p.key==='free'?'opacity:0.75;':''}">
    ${p.featured?`<div class="pricing-popular">${t('pricingMostPopular')}</div>`:''}
    <div class="pricing-name">${p.name[state.lang]||p.name.es}</div>
    <div class="pricing-price">$${p.price}<span> USD</span></div>
    <div class="pricing-period">${p.period[state.lang]||p.period.es}</div>
    ${p.limits?`<div style="font-size:11px;color:rgba(255,160,100,0.85);margin-bottom:8px">${p.limits[state.lang]||p.limits.es}</div>`:''}
    <div class="pricing-features">${(p.features[state.lang]||p.features.es).map(f=>`<div class="pricing-feature"><span class="pricing-check">✓</span>${f}</div>`).join('')}</div>

  </div>`).join('')}
  </div>`;
}

  const map={home:buildHome,chat:buildChat,lessons:buildLessons,devotional:buildDevotional,reading:buildReading,quiz:buildQuiz,haven:buildHaven,churches:buildChurches,store:buildStore,contact:buildContact,privacy:buildPrivacy,terms:buildTerms};

  mc.innerHTML=(map[pg]||buildHome)();

  if(pg==='chat') setupChatEvents();
  window.scrollTo(0,0);
}

// ── Cloudflare Worker URL ─────────────────────────────
// Una vez que subas el worker a Cloudflare, pon aquí la URL
// Ejemplo: 'https://myfather-api.TU_USUARIO.workers.dev'
const CF_WORKER_URL = 'https://myfather-api.mirandavilla341.workers.dev';


async function callAI(txt, useDeep){
  const lng = state.lang==='en' ? 'English' : 'Spanish (español)';
  const isK = state.mode==='kids';
  const maxTok = useDeep ? 700 : 250;

  const sysKids = `You are a friendly biblical assistant for children ages 4-12. Always respond in ${lng}. Use simple warm language and occasional emojis ⭐🙏. NEVER share violent, sexual or inappropriate content. If a child mentions danger, calmly tell them to talk to a trusted adult. Max 2 short paragraphs.`;
  const sysDeep = `You are a wise Christian biblical theologian and tutor — the AI of MyFather platform. Always respond in ${lng}. Cite Bible verses with exact references (Book Chapter:Verse). Answer with depth, nuance and compassion. If user mentions suicidal thoughts, respond with love and include crisis resources immediately. Max 300 words.`;
  const sysFast = `You are a warm Christian biblical assistant. Always respond in ${lng}. Be helpful and concise. Cite 1 relevant Bible verse. Max 100 words. No lengthy preamble.`;

  const systemPrompt = isK ? sysKids : (useDeep ? sysDeep : sysFast);
  const messages = [...state.chatHistory.slice(-6), { role:'user', content: txt }];

  // Todo el AI pasa por Cloudflare Worker — las API keys están seguras allá
  const r = await fetch(`${CF_WORKER_URL}/ai/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      layer: useDeep ? 3 : 2,
      system: systemPrompt,
      messages,
      max_tokens: maxTok
    })
  });
  if(!r.ok){
    const err = await r.text().catch(()=>'');
    throw new Error(`Worker ${r.status}: ${err.slice(0,100)}`);
  }
  const d = await r.json();
  if(d.error) throw new Error(typeof d.error === 'string' ? d.error : JSON.stringify(d.error));
  return { text: d.content?.[0]?.text || '...', layer: useDeep ? 3 : 2 };
}

function detectCrisis(txt){
  const l=txt.toLowerCase();
  if(SUICIDE_KW.some(k=>l.includes(k))) return 'suicide';
  if(ABUSE_KW.some(k=>l.includes(k)))   return 'abuse';
  return null;
}

// Determina qué capa usar
function routeMessage(txt) {
  const l = txt.toLowerCase().trim();
  const lang = state.lang === 'en' ? 'en' : 'es';
  // Capa 1: respuesta instantánea
  const patterns = INSTANT_MAP[lang] || INSTANT_MAP.es;
  for(const entry of patterns){
    if(entry.p.test(l)) return { layer:1, response: entry.r(state.user?.name||'') };
  }
  // Capa 3: DeepSeek para preguntas profundas
  if(txt.length > 120 || COMPLEX_KW.some(k => l.includes(k))) return { layer:3 };
  // Capa 2: Haiku para todo lo demás
  return { layer:2 };
}

async function sendChat(){
  if(chatBusy) return;
  const inp=document.getElementById('chat-inp');
  const txt=inp.value.trim(); if(!txt) return;
  inp.value='';
  const msgs=document.getElementById('chat-msgs');
  if(!msgs) return;

  msgs.innerHTML+=`<div class="message user"><div class="msg-avatar">👤</div><div><div class="msg-bubble">${esc(txt)}</div></div></div>`;

  // Crisis check siempre primero
  const cr=detectCrisis(txt);
  if(cr==='suicide'){
    logCrisis('suicide', txt);
    msgs.innerHTML+=crisisMsg(); msgs.scrollTop=msgs.scrollHeight; return;
  }
  if(cr==='abuse'){
    logCrisis('abuse', txt);
    msgs.innerHTML+=abuseMsg(); msgs.scrollTop=msgs.scrollHeight; return;
  }

  // Routing híbrido
  const route = routeMessage(txt);

  // Capa 1: instantánea, sin API — no cuenta contra el límite
  if(route.layer === 1){
    const reply = route.response;
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:reply});
    saveChatMessage(txt, reply);
    const vm=reply.match(/\*([^*]{10,})\*\s*[—–-]\s*(\S[^\n]{0,50})/);
    let main=esc(reply),vhtml='';
    if(vm){vhtml=`<div class="msg-verse">${esc(vm[1])}<div class="msg-ref">— ${esc(vm[2])}</div></div>`;main=esc(reply.replace(vm[0],'')).trim();}
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${main}${vhtml}</div></div></div>`;
    msgs.scrollTop=msgs.scrollHeight;
    return;
  }

  // Capas 2 y 3 — verificar límite del plan
  if(!canSendMsg()){
    const lim = getMsgLimit();
    const isEs = state.lang==='es';
    const upgradeBtn = `<button class="btn btn-gold btn-sm" style="margin-top:10px" onclick="navigate('pricing-page')">
      ${isEs?'Ver planes →':'See plans →'}
    </button>`;
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">
      ${isEs
        ? `Has usado tus <strong>${lim} mensajes gratuitos</strong> de este mes. Puedes comprar mensajes adicionales en la tienda o actualizar tu plan para continuar.`
        : `You've used your <strong>${lim} free messages</strong> this month. Buy extra messages in the store or upgrade your plan to continue.`}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${upgradeBtn}
        <button class="btn btn-outline btn-sm" onclick="navigateApp('store')">
          ${isEs?'Tienda de mensajes ✨':'Message store ✨'}
        </button>
      </div>
    </div></div></div>`;
    msgs.scrollTop=msgs.scrollHeight;
    return;
  }

  // Capas 2 y 3: necesitan API
  const lid='l'+Date.now();
  const layerLabel = route.layer===3
    ? `<span style="font-size:9px;opacity:0.4;margin-left:6px">⚡ Deep</span>`
    : `<span style="font-size:9px;opacity:0.4;margin-left:6px">⚡ Fast</span>`;
  msgs.innerHTML+=`<div class="message ai" id="${lid}"><div class="msg-avatar">✝️</div><div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div></div></div>`;
  msgs.scrollTop=msgs.scrollHeight; chatBusy=true;

  try{
    const result = await callAI(txt, route.layer === 3);
    const reply = result.text;
    state.chatHistory.push({role:'user',content:txt},{role:'assistant',content:reply});
    state.msgThisMonth++; // incrementar contador
    saveChatMessage(txt, reply);
    document.getElementById(lid)?.remove();
    const vm=reply.match(/["""]([^"""]{10,})["""]\s*[—–-]\s*(\S[^\n]{0,50})/);
    let main=esc(reply),vhtml='';
    if(vm){vhtml=`<div class="msg-verse">${esc(vm[1])}<div class="msg-ref">— ${esc(vm[2])}</div></div>`;main=esc(reply.replace(vm[0],'')).trim();}
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble">${main}${vhtml}${layerLabel}</div></div></div>`;
  }catch(e){
    document.getElementById(lid)?.remove();
    msgs.innerHTML+=`<div class="message ai"><div class="msg-avatar">✝️</div><div><div class="msg-bubble" style="color:rgba(245,240,232,0.5)">${t('chatError')}</div></div></div>`;
  }
  chatBusy=false; msgs.scrollTop=msgs.scrollHeight;
}

async function markReadingDone(){
  const btn=document.getElementById('mark-read-btn');
  if(btn){ btn.disabled=true; btn.textContent='✓ '+( state.lang==='es'?'¡Marcado!':'Marked!'); }

  // Actualizar racha en Supabase
  if(state.user){
    try{
      const today=new Date().toISOString().split('T')[0];
      // Guardar en reading_progress
      await db.from('reading_progress').upsert({
        user_id: state.user.id,
        day_number: new Date().getDate(),
        book: 'daily',
        chapter: today,
        read_at: new Date().toISOString()
      },{onConflict:'user_id,day_number'});
      // Incrementar racha y total_verses
      const newStreak = state.streak+1;
      await db.from('profiles').update({
        streak: newStreak,
        total_verses: (state.user.total_verses||0)+1,
        updated_at: new Date().toISOString()
      }).eq('id',state.user.id);
      state.streak=newStreak;
      state.user.total_verses=(state.user.total_verses||0)+1;
      showToast(`🔥 ${state.lang==='es'?`¡Racha: ${newStreak} días!`:`Streak: ${newStreak} days!`}`);
    }catch(e){ showToast(state.lang==='es'?'Guardado localmente':'Saved locally'); }
  }
}

function buildQuiz(){
  state.quizState={q:0,score:0,answered:false,saved:false};
  return renderQuizQ();
}
function renderQuizQ(){
  const isK=state.mode==='kids';
  const allQs=QUIZ[state.lang]||QUIZ.es;
  // Filtrar por modo — niños ven preguntas kids, adultos ven las de adultos
  const qs=allQs.filter(q=>isK?q.kids:!q.kids);
  if(!qs.length||state.quizState.q>=qs.length) return renderQuizEnd();
  const q=qs[state.quizState.q];
  const progress=Math.round((state.quizState.q/qs.length)*100);

  return `<div class="page-header">
  <h1>${t('quizTitle')}</h1>
  <div style="display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:rgba(245,240,232,0.5)">
    <span>🔥 ${state.streak}</span>
    <span>·</span>
    <span>${t('quizScoreLabel')} ${state.quizState.score}/${state.quizState.q}</span>
    <span>·</span>
    <span>${state.quizState.q+1}/${qs.length}</span>
  </div>
</div>
<div class="quiz-card">
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%;transition:width .4s ease"></div></div>
  <div class="quiz-q" style="margin-top:16px">${q.q}</div>
  <div class="quiz-options" id="qopts">
    ${q.opts.map((o,i)=>`<div class="quiz-option" id="qo${i}" onclick="answerQuiz(${i})">
      <div class="quiz-letter">${'ABCD'[i]}</div>
      <span>${o}</span>
    </div>`).join('')}
  </div>
  <div id="qfb" style="margin-top:20px;display:none"></div>
</div>`;
}
function answerQuiz(idx){
  if(state.quizState.answered) return;
  state.quizState.answered=true;
  const isK=state.mode==='kids';
  const qs=(QUIZ[state.lang]||QUIZ.es).filter(q=>isK?q.kids:!q.kids);
  const q=qs[state.quizState.q];
  document.getElementById(`qo${q.correct}`)?.classList.add('correct');
  if(idx!==q.correct) document.getElementById(`qo${idx}`)?.classList.add('wrong');
  else state.quizState.score++;
  const fb=document.getElementById('qfb'); if(!fb) return;
  fb.style.display='block';
  fb.innerHTML=`<div style="font-size:14px;margin-bottom:10px">${idx===q.correct
    ?`<span style="color:#7ecfa0;font-weight:500">✅ ${t('quizCorrect')}</span>`
    :`<span style="color:#f08080">❌ ${t('quizWrong')}</span> <strong style="color:#7ecfa0">${q.opts[q.correct]}</strong>`}
  </div>
  ${q.verse&&q.verse!=='—'?`<div style="font-family:var(--font-serif);font-style:italic;font-size:13px;color:rgba(245,240,232,0.5);margin-bottom:14px">📖 ${q.verse}</div>`:''}
  <button class="btn btn-gold btn-sm" onclick="nextQuizQ()">${state.quizState.q+1<qs.length?t('quizNext'):t('quizFinish')}</button>`;
}
function nextQuizQ(){
  state.quizState.q++;
  state.quizState.answered=false;
  document.getElementById('main-content').innerHTML=renderQuizQ();
}
function renderQuizEnd(){
  const qs=(QUIZ[state.lang]||QUIZ.es).filter(q=> state.mode==='kids' ? q.kids : !q.kids);
  const total=qs.length||1;
  const pct=Math.round((state.quizState.score/total)*100);
  const emoji=pct>=90?'🏆':pct>=70?'⭐':pct>=50?'📖':'💪';

  // Guardar en Supabase
  if(state.user && !state.quizState.saved){
    state.quizState.saved=true;
    saveQuizScore(state.quizState.score, total);
    // Actualizar quiz_avg en perfil
    const newAvg=Math.round((( state.user.quiz_avg||0)+pct)/2);
    db.from('profiles').update({quiz_avg:newAvg,updated_at:new Date().toISOString()}).eq('id',state.user.id).then(()=>{
      state.user.quiz_avg=newAvg;
    });
    // Actualizar total_lessons si es la primera vez
    if(!state.user.total_lessons){
      db.from('profiles').update({total_lessons:1}).eq('id',state.user.id);
      state.user.total_lessons=1;
    }
  }

  return `<div class="page-header"><h1>${t('quizCompleteTitle')}</h1></div>
<div class="quiz-card" style="text-align:center">
  <div style="font-size:72px;margin-bottom:20px;animation:fadeIn .5s ease">${emoji}</div>
  <div style="font-family:var(--font-display);font-size:42px;color:var(--gold);margin-bottom:8px">${state.quizState.score}/${total}</div>
  <div style="font-size:20px;margin-bottom:8px;color:${pct>=70?'#7ecfa0':'var(--parchment)'}">${pct}%</div>
  <div style="font-size:14px;color:rgba(245,240,232,0.5);line-height:1.7;margin-bottom:28px">${pct>=80?t('quizCompleteSub1'):t('quizCompleteSub2')}</div>
  ${pct>=90?`<div style="font-size:13px;color:var(--gold);margin-bottom:20px">🎉 ${state.lang==='es'?'¡Puntaje perfecto! Se guardó en tu perfil.':'Perfect score! Saved to your profile.'}</div>`:''}
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-gold" onclick="navigateApp('quiz')">${t('quizRetry')}</button>
    <button class="btn btn-outline" onclick="navigateApp('chat')">${t('quizAsk')}</button>
  </div>
</div>`;
}

function loadChurchesByGPS(){
  const isEs=state.lang==='es';
  const locText=document.getElementById('church-loc-text');
  const container=document.getElementById('church-list-container');
  if(locText) locText.textContent=isEs?'Obteniendo ubicación GPS...':'Getting GPS location...';

  if(!navigator.geolocation){
    renderChurchesFallback(isEs);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {latitude:lat,longitude:lng}=pos.coords;
      if(locText) locText.innerHTML=`${isEs?'Cerca de':'Near'} <strong style="color:var(--parchment)">${lat.toFixed(3)}, ${lng.toFixed(3)}</strong>`;
      // Buscar en Google Maps con el link real
      const mapsUrl=`https://www.google.com/maps/search/iglesia+cristiana/@${lat},${lng},13z`;
      if(container) container.innerHTML=`
        <div style="margin-bottom:16px">
          ${renderChurchCards(isEs)}
        </div>
        <a href="${mapsUrl}" target="_blank" rel="noopener" class="btn btn-outline" style="display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none">
          🗺️ ${isEs?'Ver más en Google Maps':'See more on Google Maps'}
        </a>`;
    },
    err=>{
      if(locText) locText.textContent=isEs?'No se pudo obtener ubicación':'Could not get location';
      renderChurchesFallback(isEs);
    },
    {timeout:8000}
  );
}

// AUTH HANDLERS (Supabase real)
// ══════════════════════════════════
async function handleAuth(type){
  const email = document.getElementById(`ae-${type}`)?.value.trim();
  const pass  = document.getElementById(`ap-${type}`)?.value.trim();
  const err   = document.getElementById(`ae-err-${type}`);
  const btn   = document.getElementById(`ab-${type}`);
  if(!email || !pass || pass.length < 6){
    if(err){ err.style.display='block'; err.textContent=t('authLoginError'); } return;
  }
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  try {
    if(type === 'login'){
      await supaLogin(email, pass);
      const uid = (await db.auth.getUser()).data.user.id;
      const profile = await loadProfile(uid);
      state.user = {
        id:    uid,
        email,
        name:  profile?.full_name || email.split('@')[0],
        plan:  profile?.plan || 'free',
        streak: profile?.streak || 0,
        account_type: profile?.account_type || 'adult',
        coins: profile?.coins || 0,
      };
      state.streak = state.user.streak;
      await loadMsgCount(uid);
      navigate('app'); navigateApp('home');
    } else {
      const name        = document.getElementById('an-inp')?.value.trim();
      const accountType = document.getElementById('atype')?.value || 'adult';
      if(!name){ if(err){ err.style.display='block'; err.textContent=t('authLoginError'); } return; }
      await supaSignUp(email, pass, name, accountType);
      showToast(t('authSignupSuccess') + ' — ' + (state.lang==='en'?'Check your email!':'¡Revisa tu email!'));
      // auto-login after signup
      try {
        await supaLogin(email, pass);
        const uid = (await db.auth.getUser()).data.user.id;
        await loadProfile(uid);
        state.user = { id: uid, email, name, plan:'free', streak:0, account_type: accountType, coins:0 };
        state.msgThisMonth = 0;
        // Email de bienvenida via Worker → Resend (no-blocking)
        if(CF_WORKER_URL){
          fetch(`${CF_WORKER_URL}/welcome`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ email, name, lang: state.lang, plan:'free' })
          }).catch(()=>{});
        }
        navigate('app'); navigateApp('home');
      } catch { navigate('login'); }
    }
  } catch(e){
    if(err){
      err.style.display='block';
      err.textContent = e.message || t('authLoginError');
    }
  } finally {
    if(btn){ btn.disabled=false; btn.textContent=type==='login'?t('authLoginBtn'):t('authSignupBtn'); }
  }
}

async function sendPasswordReset(email){
  if(!email){ showToast(state.lang==='es'?'Ingresa tu email':'Enter your email'); return; }
  const redirectTo = window.location.origin + (window.location.pathname || '/') + '?reset=1';
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
  if(error) showToast(error.message);
  else {
    showToast(t('forgotPassSent'));
    setTimeout(()=> document.getElementById('forgot-modal')?.remove(), 1500);
  }
}

function showCrisis(){document.getElementById('crisis-modal')?.classList.add('show');}
function hideCrisis(){document.getElementById('crisis-modal')?.classList.remove('show');}
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function showForgotPass(){
  const email = document.getElementById('ae-login')?.value.trim()||'';
  const box = document.createElement('div');
  box.id = 'forgot-modal';
  box.style.cssText = 'position:fixed;inset:0;background:rgba(26,20,16,0.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px';
  box.innerHTML=`<div style="background:#1e1810;border:1px solid rgba(201,151,58,0.3);border-radius:20px;padding:36px;max-width:380px;width:100%">
    <div style="font-family:var(--font-display);font-size:20px;color:var(--gold);margin-bottom:8px">✉️ ${t('forgotPassTitle')}</div>
    <div style="font-size:13px;color:rgba(245,240,232,0.45);margin-bottom:20px">${t('forgotPassSub')}</div>
    <input class="input" id="fp-email" type="email" value="${email}" placeholder="tu@correo.com" style="margin-bottom:14px">
    <div style="display:flex;gap:10px">
      <button class="btn btn-gold" style="flex:1;justify-content:center" onclick="sendPasswordReset(document.getElementById('fp-email').value.trim())">${t('forgotPassBtn')}</button>
      <button class="btn btn-ghost" onclick="document.getElementById('forgot-modal').remove()">✕</button>
    </div>
  </div>`;
  document.body.appendChild(box);
  box.addEventListener('click', e=>{ if(e.target===box) box.remove(); });
}

function attachGlobalEvents(){
  document.getElementById('crisis-modal')?.addEventListener('click',function(e){if(e.target===this)hideCrisis();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCrisis();});
}
